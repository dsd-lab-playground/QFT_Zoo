id: tim-squared
name: 'TIM$^2$ (two tricritical Ising models)'
d: 2
summary: Two decoupled copies of the tricritical Ising CFT.
tags: [CFT, interacting, unitary, rational]

description: 'The symmetry of TIM$^2$ is the dihedral group $D_4$ of order 8 generated by the spin flips $f_1, f_2$ and the exchange $s$.'

symmetry:
  spacetime: conformal
  supercharges: 0
  global: '$D_4$: spin flips $f_1, f_2$ and exchange $s$'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '7/5'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '3/40'
  method: exact

operators:
- name: '\sigma_1,\ \sigma_2'
  Delta: '3/40'
  spin: 0
  weights: '(\tfrac{3}{80}, \tfrac{3}{80})'
  degeneracy: 2
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: product_of
  target: tricritical-ising

references:
- key: fqs1984
  title: Conformal Invariance, Unitarity, and Critical Exponents in Two Dimensions
  authors: Friedan, Qiu, Shenker
  year: 1984
  journal: Phys. Rev. Lett. 52, 1575
  doi: '10.1103/PhysRevLett.52.1575'

contributors: [nathansbenjamin]
