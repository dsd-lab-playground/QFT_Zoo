id: gny-n1-3d
name: '3d $\mathcal{N}=1$ super-Ising CFT (GNY model, $N=1$)'
aliases:
  - '$\mathcal{N}=1$ super-Ising model'
  - 'Gross–Neveu–Yukawa model with one Majorana fermion'
  - Minimal 3d $\mathcal{N}=1$ SCFT
d: 3
summary: >-
  The Gross–Neveu–Yukawa fixed point of one real scalar and one two-component
  Majorana fermion. Supersymmetry emerges at the critical point, making it the
  minimal 3d $\mathcal{N}=1$ superconformal field theory.
tags: [CFT, SCFT, interacting, unitary, Lagrangian, supersymmetric, critical phenomena]

description: |
  A real pseudoscalar $\phi$ coupled to one Majorana fermion through $\phi\bar\psi\psi$.
  At the critical point the theory has emergent $\mathcal{N}=1$ supersymmetry: it is the
  Wess–Zumino model of one real superfield with a cubic superpotential.
  It describes the time-reversal-breaking transition on the surface of a $3+1$d
  topological superconductor, reached by tuning a single parameter.

  Supersymmetry relates the leading operators: $\sigma\sim\phi$, its fermionic partner
  $\psi$ and $\epsilon \sim \phi^2$ have $\Delta_\psi = \Delta_\sigma + \tfrac12$ and
  $\Delta_\epsilon = \Delta_\sigma + 1$. The same island is found by the GNY bootstrap
  without assuming supersymmetry, which supports its emergence.

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\phi)^2 + \tfrac{1}{2}\bar\psi\gamma^\mu\partial_\mu\psi + \tfrac{g}{2}\,\phi\,\bar\psi\psi + \tfrac{1}{2}m^2\phi^2 + \tfrac{\lambda}{4!}\phi^4, \quad \text{one Majorana fermion } \psi \quad (m^2 \text{ tuned})'

symmetry:
  spacetime: '$OSp(1|4)$ — 3d $\mathcal{N}=1$ superconformal group (2 $Q$ + 2 $S$ supercharges), with parity (supersymmetry emergent)'
  supercharges: 2
  global: 'time reversal / parity ($\sigma$ odd)'

quantities:
  - symbol: '\eta_\sigma = \eta_\psi'
    description: 'Anomalous dimensions, $\eta_\sigma = 2\Delta_\sigma - 1 = \eta_\psi$'
    value: '0.168887(17)'
    method: CB, supersymmetric
    refs: [atanasov2022]
  - symbol: '\nu^{-1}'
    description: 'Inverse correlation-length exponent, $3 - \Delta_\epsilon$'
    value: '1.415557(8)'
    method: CB, supersymmetric
    refs: [atanasov2022]
  - symbol: '\omega'
    description: 'Correction-to-scaling exponent, $\Delta_{\epsilon^\prime} - 3$'
    value: '0.8869(25)'
    method: CB, supersymmetric
    refs: [atanasov2022]
  - symbol: '\lambda_{\sigma\sigma\epsilon}'
    description: OPE coefficient
    value: '1.072125(9)'
    method: CB, supersymmetric
    refs: [atanasov2022]
  - symbol: '\lambda_{\epsilon\epsilon\epsilon}/\lambda_{\sigma\sigma\epsilon}'
    description: 'Fixed by supersymmetry in terms of $\Delta_\sigma$'
    value: '1.55775(36)'
    method: CB, supersymmetric
    refs: [atanasov2022]

operators:
  - name: '\sigma'
    Delta: '0.5844435(83)'
    spin: 0
    rep: parity odd; bottom of the scalar multiplet
    method: CB
    refs: [atanasov2022]
  - name: '\psi'
    Delta: '1.0844435(83)'
    spin: '1/2'
    rep: superpartner of $\sigma$
    method: CB, from Δσ
    refs: [atanasov2022]
    note: '$\Delta_\psi = \Delta_\sigma + \tfrac12$ by supersymmetry.'
  - name: '\epsilon'
    Delta: '1.5844435(83)'
    spin: 0
    rep: parity even; top of the $\sigma$ multiplet
    method: CB, from Δσ
    refs: [atanasov2022]
    note: '$\Delta_\epsilon = \Delta_\sigma + 1$ by supersymmetry. The only relevant parity-even scalar (the tuning parameter).'
  - name: '\sigma'''
    Delta: '2.8869(25)'
    spin: 0
    rep: parity odd
    method: CB
    refs: [atanasov2022]
  - name: '\epsilon'''
    Delta: '3.8869(25)'
    spin: 0
    rep: parity even; partner of $\sigma'$
    method: CB, from Δσ′
    refs: [atanasov2022]
    note: '$\Delta_{\epsilon''} = \Delta_{\sigma''} + 1$ by supersymmetry.'
  - name: 'S_{\mu\alpha}'
    Delta: '5/2'
    spin: '3/2'
    rep: supercurrent
    method: exact
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    rep: singlet
    method: exact
    note: Stress tensor, in the same multiplet as the supercurrent.

relations:
  - type: member_of
    target: gny-3d
    at: 1

