id: w3-5-6
name: '$\mathcal{W}_3(5,6)$ minimal model'
d: 2
summary: 'The $p=5$ unitary $\mathcal{W}_3$ minimal model with the diagonal invariant.'
tags: [CFT, interacting, unitary, rational, coset, minimal model]

symmetry:
  spacetime: '$O(3,1)$, extended to two Virasoro algebras, $c = \bar c = \tfrac65$ — 2d conformal group with parity'
  supercharges: 0
  global: '$S_3$ ($\mathbb{Z}_3$ and $C: W \to -W$)'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '6/5'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '4/45'
  method: exact

operators:
- name: '\Phi_{(\omega_1;\omega_1)},\ \Phi_{(\omega_2;\omega_2)}'
  Delta: '4/45'
  spin: 0
  weights: '(\tfrac{2}{45}, \tfrac{2}{45})'
  degeneracy: 2
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: member_of
  target: w3-minimal-models
  at: 5
- type: related_to
  target: ising-x-minimal-a
  at: 4
  note: '$\mathcal{W}_3(5,6)/S_3$ has the same torus partition function as Ising $\times$ TIM.'
- type: related_to
  target: ising-x-minimal-z2
  at: 4
  note: 'The D-type invariant $\mathcal{W}_3(5,6)^D$ has the same torus partition function as (Ising $\times$ TIM)$/\mathbb{Z}_2$.'

references:
