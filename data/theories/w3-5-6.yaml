  authors: Frenkel, Kac, Wakimoto
  year: 1992
  journal: Commun. Math. Phys. 147, 295
  doi: '10.1007/BF02096589'
- key: bg2010
  title: 'The $W_N$ minimal model classification'
  authors: Beltaos, Gannon
