id: w3-6-7-c
name: '$\mathcal{W}_3(6,7)/C$'
d: 2
summary: 'Orbifold of the $\mathcal{W}_3(6,7)$ minimal model by charge conjugation $C: W \to -W$.'
tags: [CFT, interacting, unitary, rational, orbifold]

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac{10}{7}$ — 2d conformal symmetry, with parity'
  global: 'Contains the dual $\mathbb{Z}_2$ of the orbifold, odd on the $C$-twisted sector'
  parity: true
  global_group:
    - {id: Z2, group: Z2, tex: '\widehat{\mathbb{Z}}_2', note: 'The dual symmetry of the orbifold, odd on the $C$-twisted sector; the rest of the symmetry is not recorded.'}

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '10/7'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '4/63'
  method: exact

operators:
- name: '\mathcal{O}'
  Delta: '4/63'
  spin: 0
  weights: '(\tfrac{2}{63}, \tfrac{2}{63})'
  parity: unknown
  global: {Z2: unknown}
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: orbifold_of
  target: w3-6-7
  note: 'By $C: W \to -W$.'

references:
