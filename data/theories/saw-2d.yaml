    authors: Nienhuis
    year: 1982
    journal: Phys. Rev. Lett. 49, 1062
    doi: '10.1103/PhysRevLett.49.1062'
    note: 'Original Coulomb-gas prediction of $K_c$, $\nu$ and $\gamma$; the values here are as quoted in the later references.'
  - key: lsw2004
