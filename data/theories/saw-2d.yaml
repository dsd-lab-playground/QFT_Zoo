    authors: Duminil-Copin, Smirnov
    year: 2012
    journal: Ann. of Math. 175, 1653
    arxiv: '1007.0575'
  - key: saleur1992
    title: Polymers and percolation in two dimensions and twisted N=2 supersymmetry
    authors: Saleur
    year: 1992
    journal: Nucl. Phys. B 382, 486
    arxiv: hep-th/9111007
    note: 'Eq. (1): $h_L = (9L^2 - 4)/96$ for dilute polymers.'
  - key: granssamuelsson2022
    title: Global symmetry and conformal bootstrap in the two-dimensional $O(n)$ model
    authors: Grans-Samuelsson, Nivesvivat, Jacobsen, Ribault, Saleur
    year: 2022
