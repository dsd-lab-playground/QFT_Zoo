id: tim2-z4-xe
name: '$X_E = \mathrm{TIM}^2/\mathbb{Z}_4$'
aliases: ['$\mathcal{N}_{10}^{(A,E_6)}$', '$\mathrm{TIM}^2/\langle f_1f_2, s\rangle^{\rm tors}$', '$\mathrm{PF}_8/\langle r^4, C\rangle^{\rm tors}$']
d: 2
summary: 'Orbifold of TIM$^2$ by $\mathbb{Z}_4 = \langle f_1 s\rangle$; it shares its torus partition function with a different CFT, $X_O$.'
tags: [CFT, interacting, unitary, rational, orbifold]

description: |
  The symmetry of TIM$^2$ is the dihedral group $D_4$ of order 8 generated by the spin flips $f_1, f_2$ and the exchange $s$. The orbifolds by $\mathbb{Z}_4$ and by $\langle f_1f_2, s\rangle$ with discrete torsion coincide and give this theory, which is also the block-diagonal bosonized $\mathcal{N}=1$ minimal model $\mathcal{N}_{10}^{(A,E_6)}$.

  $X_E$ and $X_O$ have the same chiral algebra and the same torus partition function, but glue left- and right-moving modules differently, so they are not isomorphic as full CFTs.

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac75$ — 2d conformal symmetry, with parity'
  global: 'Contains the dual $\mathbb{Z}_4$ of the orbifold and the image of $f_1$ ($\simeq s$), since $\mathbb{Z}_4$ is normal in $D_4$'
  parity: true
  global_group:
    - {id: Z4, group: Z4, tex: '\widehat{\mathbb{Z}}_4', note: 'The dual symmetry of the orbifold.'}
    - {id: Z2_f, group: Z2, tex: '\mathbb{Z}_2^{f_1}', note: 'The image of $f_1$ ($\simeq s$); how it combines with the dual $\mathbb{Z}_4$ is not recorded.'}

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '7/5'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '1/8'
  method: exact

operators:
- name: '\mathcal{O}'
  Delta: '1/8'
  spin: 0
  weights: '(\tfrac{1}{16}, \tfrac{1}{16})'
  degeneracy: 2
  parity: unknown
  global: {Z4: unknown, Z2_f: unknown}
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: orbifold_of
  target: tim-squared
  note: 'By $\mathbb{Z}_4 = \langle f_1 s \rangle$.'
- type: same_partition_function
  target: tim2-d4tors-xo
  note: 'Same chiral algebra and torus partition function; different gluing.'

