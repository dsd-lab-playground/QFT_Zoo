    title: The Gross-Neveu-Yukawa archipelago
    authors: Erramilli, Iliesiu, Kravchuk, Liu, Poland, Simmons-Duffin
    year: 2023
    journal: JHEP 02 (2023) 036
    arxiv: '2210.02492'
  - key: mitchell2024
    title: Bounding irrelevant operators in the 3d Gross-Neveu-Yukawa CFTs
    authors: Mitchell, Poland
    year: 2024
    arxiv: '2406.12974'
  - key: ihrig2018
