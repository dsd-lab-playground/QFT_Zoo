id: zk-parafermions
name: '$\mathbb{Z}_k$ parafermions $\mathrm{PF}_k = SU(2)_k/U(1)$'
aliases: [Fateev–Zamolodchikov parafermions, '$\mathrm{PF}_k$']
d: 2
summary: 'The coset $SU(2)_k/U(1)$ with the diagonal invariant, $c = \frac{2(k-1)}{k+2}$: Ising ($k=2$), 3-state Potts ($k=3$), $\mathbb{Z}_4$ parafermions at $c=1$, …'
tags: [CFT, interacting, unitary, rational, exactly solvable, coset, family]

description: 'Fields $\Phi^l_m$ with $(l, m) \sim (k-l, m+k)$ have $h = \frac{l(l+2)}{4(k+2)} - \frac{m^2}{4k}$ for $|m| \le l$; the parafermion currents $\psi_l$ have $h = \frac{l(k-l)}{k}$. The global symmetry is the dihedral group generated by the $\mathbb{Z}_k$ rotation $r$ and charge conjugation $C: \Phi^l_m \to \Phi^l_{-m}$; it acts on-site in the Fateev–Zamolodchikov clock chain. The gap comes from $\Phi^1_{\pm1}$.'

parameters:
- symbol: k
  description: 'Level of $SU(2)_k$.'
  range: 'integer $k \geq 2$'

family:
  parameter: k
  start: 2
  formulas:
    c: '2*(k-1)/(k+2)'
    gap: '(k-1)/(k*(k+2))'
  show: 9
  overrides:
  - at: 4
    note: '$c = 1$: the orbifold branch at $R = \sqrt6$.'
  - at: 6
    note: 'Same partition function as the bosonized $\mathcal{N}=1$ minimal model $\mathcal{N}_6^{(D,A)+}$.'

symmetry:
  spacetime: conformal
  supercharges: 0
  global: 'Dihedral $D_k$ ($\mathbb{Z}_k$ rotations and charge conjugation)'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '\frac{2(k-1)}{k+2}'
  method: exact
  refs: [gepnerqiu1987]
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '\frac{k-1}{k(k+2)}'
  method: exact
  refs: [gepnerqiu1987]

operators:
- name: '\Phi^1_{\pm 1}'
  Delta: '\frac{k-1}{k(k+2)}'
  spin: 0
  degeneracy: 2
  note: 'Lightest primaries ($k \geq 3$).'

references:
- key: gepnerqiu1987
  title: Modular invariant partition functions for parafermionic field theories
  authors: Gepner, Qiu
  year: 1987
  journal: Nucl. Phys. B285, 423
  doi: '10.1016/0550-3213(87)90348-8'
- key: kacpeterson1984
  title: Infinite-dimensional Lie algebras, theta functions and modular forms
  authors: Kac, Peterson
  year: 1984
  journal: Adv. Math. 53, 125
  doi: '10.1016/0001-8708(84)90032-X'
- key: gko1985
  title: Virasoro algebras and coset space models
  authors: Goddard, Kent, Olive
  year: 1985
  journal: Phys. Lett. B152, 88
  doi: '10.1016/0370-2693(85)91145-1'

contributors: [nathansbenjamin]
