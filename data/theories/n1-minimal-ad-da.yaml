id: n1-minimal-ad-da
name: 'Bosonized $\mathcal{N}=1$ minimal models $\mathcal{N}_m^{(A,D)\pm}$, $\mathcal{N}_m^{(D,A)\pm}$'
d: 2
summary: 'Bosonized $\mathcal{N}=1$ minimal models with D-type invariants, even $m \geq 6$, four theories per $m$.'
tags: [CFT, interacting, unitary, rational, coset, minimal model, family]

description: |
  $\mathcal{N}_m$ denotes the $\mathcal{N}=1$ superconformal minimal model, the coset $SU(2)_{m-2}\times SU(2)_2/SU(2)_m$ with $c = \frac32 - \frac{12}{m(m+2)}$ ($m=3$ is the tricritical Ising model), made bosonic by summing over spin structures. Weights are $h_{r,s} = \frac{((m+2)r - ms)^2 - 4}{8m(m+2)} + \frac{1-(-1)^{r-s}}{32}$. For even $m$ the invariants come in pairs $\pm$ (the GSO choice): $+$ keeps the Ramond ground state $(c/24, c/24)$ as a scalar, $-$ pairs it as $(c/24, c/24+1)$.

  The D-projection removes $(2,2)$; for $m \geq 8$ the gap is the NS field $(3,3)$, $\Delta_{\rm gap} = \frac{8}{m(m+2)} = \frac23\big(\frac32 - c\big)$. At $m = 6$ ($c = \frac54$) the four invariants have different gaps, and all are orbifolds of the $\mathbb{Z}_6$ parafermions.

parameters:
- symbol: m
  description: Minimal-model label.
  range: 'even $m \geq 6$'

family:
  parameter: m
  start: 6
  step: 2
  variants: ['(A,D)+', '(A,D)-', '(D,A)+', '(D,A)-']
  formulas:
    c: '3/2 - 12/(m*(m+2))'
    gap: '8/(m*(m+2))'
  show: 4
  overrides:
  - at: 6
    variant: '(A,D)+'
    gap: '5/48'
    note: 'Same partition function as $\mathrm{PF}_6/Cr$.'
  - at: 6
    variant: '(A,D)-'
    gap: '1/8'
    note: 'Same partition function as $\mathrm{PF}_6/\langle r^2, Cr\rangle$.'
  - at: 6
    variant: '(D,A)+'
    gap: '5/48'
    note: 'Same partition function as $\mathrm{PF}_6$.'
  - at: 6
    variant: '(D,A)-'
    gap: '1/6'
    note: 'Same partition function as $\mathrm{PF}_6/\mathbb{Z}_2$.'

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac32 - \tfrac{12}{m(m+2)}$ — 2d conformal symmetry; parity not recorded'
  notes: 'Bosonic theory: the $\mathcal{N}=(1,1)$ supercurrents $G$, $\bar G$ have spin $\tfrac32$ and are not local operators here, so the $\mathcal{N}=1$ super-Virasoro symmetry ($OSp(1|2)\times OSp(1|2)$ globally, 2 $Q$ + 2 $S$ supercharges) acts on the fermionic minimal model, not on this bosonization.'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '\frac32 - \frac{12}{m(m+2)}'
  method: exact
  refs: [fqs1985]
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '\frac{8}{m(m+2)}'
  method: exact
  note: 'For $m \geq 8$.'

operators:
- name: '\Phi_{3,3}'
  Delta: '\frac{8}{m(m+2)}'
  spin: 0
  note: 'NS sector; lightest non-vacuum primary for $m \geq 8$.'

relations:
- type: related_to
  target: n1-minimal-aa-even
  note: 'The other simple-current invariants at the same $m$.'

references:
- key: fqs1985
  title: Superconformal invariance in two dimensions and the tricritical Ising model
  authors: Friedan, Qiu, Shenker
  year: 1985
  journal: Phys. Lett. B151, 37
  doi: '10.1016/0370-2693(85)90819-6'
- key: gko1986
  title: Unitary representations of the Virasoro and super-Virasoro algebras
  authors: Goddard, Kent, Olive
  year: 1986
  journal: Commun. Math. Phys. 103, 105
  doi: '10.1007/BF01464283'
- key: cappelli1987
  title: Modular invariant partition functions of superconformal theories
  authors: Cappelli
  year: 1987
  journal: Phys. Lett. B185, 82
  doi: '10.1016/0370-2693(87)91532-2'
- key: ks1993
  title: Simple currents versus orbifolds with discrete torsion -- a complete classification
  authors: Kreuzer, Schellekens
  year: 1993
  arxiv: hep-th/9306145

