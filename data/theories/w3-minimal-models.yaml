id: w3-minimal-models
name: '$\mathcal{W}_3$ minimal models $\mathcal{W}_3(p, p+1)$'
aliases: ['$SU(3)_{p-3}\times SU(3)_1/SU(3)_{p-2}$']
d: 2
summary: 'Unitary minimal models of the $\mathcal{W}_3$ algebra (diagonal invariant), $c = 2\big(1 - \frac{12}{p(p+1)}\big)$, $p \geq 4$; $p=4$ is the 3-state Potts model.'
tags: [CFT, interacting, unitary, rational, exactly solvable, coset, minimal model, family]

description: 'Primaries are labelled by pairs of $SU(3)$ weights $(\Lambda_+; \Lambda_-)$, with $h = \frac{|(p+1)(\Lambda_+ + \rho) - p(\Lambda_- + \rho)|^2 - |\rho|^2}{2p(p+1)}$. The lightest are $(\omega_1;\omega_1)$ and its conjugate, with $h = \frac{4}{3p(p+1)}$. The global symmetry is $S_3$: the $\mathbb{Z}_3$ centre and charge conjugation $W \to -W$. Modular invariants are classified by Beltaos and Gannon.'

parameters:
- symbol: p
  description: Minimal-model label.
  range: 'integer $p \geq 4$'

family:
  parameter: p
  start: 4
  formulas:
    c: '2 - 24/(p*(p+1))'
    gap: '8/(3*p*(p+1))'
  show: 8

symmetry:
  spacetime: conformal
  supercharges: 0
  global: '$S_3$'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '2\left(1 - \frac{12}{p(p+1)}\right)'
  method: exact
  refs: [fz1987, fkw1992]
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '\frac{8}{3p(p+1)}'
  method: exact

operators:
- name: '\Phi_{(\omega_1;\omega_1)},\ \Phi_{(\omega_2;\omega_2)}'
  Delta: '\frac{8}{3p(p+1)}'
  spin: 0
  degeneracy: 2
  note: Lightest primaries.

references:
- key: fz1987
  title: 'Conformal quantum field theory models in two dimensions having $\mathbb{Z}_3$ symmetry'
  authors: Fateev, Zamolodchikov
  year: 1987
  journal: Nucl. Phys. B280, 644
  doi: '10.1016/0550-3213(87)90166-0'
- key: fkw1992
  title: Characters and fusion rules for W-algebras via quantized Drinfeld-Sokolov reduction
  authors: Frenkel, Kac, Wakimoto
  year: 1992
  journal: Commun. Math. Phys. 147, 295
  doi: '10.1007/BF02096589'
- key: bbss1988
  title: Coset construction for extended Virasoro algebras
  authors: Bais, Bouwknegt, Surridge, Schoutens
  year: 1988
  journal: Nucl. Phys. B304, 371
  doi: '10.1016/0550-3213(88)90632-3'
- key: acl2018
  title: W-algebras as coset vertex algebras
  authors: Arakawa, Creutzig, Linshaw
  year: 2018
  arxiv: '1801.03822'
- key: bg2010
  title: 'The $W_N$ minimal model classification'
  authors: Beltaos, Gannon
  year: 2010
  arxiv: '1004.1205'

contributors: [nathansbenjamin]
