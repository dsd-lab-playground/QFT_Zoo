id: free-scalar-3d
name: Free massless scalar (3d)
aliases:
  - Gaussian fixed point
d: 3
summary: >-
  A single free massless real scalar in three dimensions — the Gaussian fixed
  point and UV starting point of the Wilson–Fisher flow.
tags: [CFT, free, unitary, Lagrangian, exactly solvable]

description: |
  The simplest CFT in $d=3$. All correlators follow from Wick
  contractions of $\langle \phi(x)\phi(0)\rangle \propto |x|^{-1}$.
  Turning on the relevant $\phi^4$ coupling (with the mass tuned to criticality)
  triggers an RG flow to the 3d Ising CFT.

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\phi)^2'

symmetry:
  spacetime: conformal
  supercharges: 0
  global: '$\mathbb{Z}_2$ ($\phi\to-\phi$), plus shift symmetry $\phi \to \phi + c$'

quantities:
  - key: F
    symbol: 'F'
    description: '$S^3$ free energy, $F = -\log Z_{S^3}$'
    value: '\frac{\log 2}{8} - \frac{3\zeta(3)}{16\pi^2} \approx 0.0638'
    method: exact
    refs: [klebanov2011]
  - key: c_tilde
    symbol: '\tilde c'
    description: 'Thermal free energy density on $S^1_\beta\times\mathbb{R}^{2}$, $f = -\tilde c\,\frac{\zeta(3)}{2\pi}\,T^{3}$ ($\tilde c = 1$ for one free real scalar)'
    value: '1'
    method: exact
    refs: [sachdev1993, iliesiu2018]
    note: 'Normalization of Sachdev eq. (1): $f = -\tilde c\,\Gamma(d/2)\zeta(d)\pi^{-d/2}T^d$. Iliesiu et al. (2018), Sec. 2.1.1: one free real scalar has $b_T = -2d\zeta(d)/S_d$ and $f = b_T/d$, i.e. $f = -\Gamma(d/2)\zeta(d)\pi^{-d/2}T^d$ $= -0.191313\,T^3$.'

operators:
  - name: '\phi'
    Delta: '\frac{1}{2}'
    spin: 0
    rep: '$\mathbb{Z}_2$-odd'
    method: exact
  - name: '\phi^2'
    Delta: 1
    spin: 0
    rep: '$\mathbb{Z}_2$-even'
    method: exact
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    rep: '$\mathbb{Z}_2$-even'
    method: exact
    note: Stress tensor (conserved).

relations:
  - type: flows_to
    target: ising-3d
    note: 'Relevant $\phi^4$ deformation, with $m^2$ tuned to the critical point (Wilson–Fisher).'

references:
  - key: klebanov2011
    title: F-Theorem without Supersymmetry
    authors: Klebanov, Pufu, Safdi
    year: 2011
    arxiv: '1105.4598'
  - key: sachdev1993
    title: Polylogarithm identities in a conformal field theory in three dimensions
    authors: Sachdev
    year: 1993
    journal: Phys. Lett. B 309, 285
    arxiv: hep-th/9305131
    note: 'Defines the thermal coefficient $\tilde c$ (eq. 1) and proves $\tilde c/N = 4/5$ for the $O(N)$ model at $N=\infty$.'
  - key: iliesiu2018
    title: The Conformal Bootstrap at Finite Temperature
    authors: Iliesiu, Koloğlu, Mahajan, Perlmutter, Simmons-Duffin
    year: 2018
    journal: JHEP 10 (2018) 070
    arxiv: '1802.10266'

contributors: [nathansbenjamin, davidsd]
