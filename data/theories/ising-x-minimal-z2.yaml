id: ising-x-minimal-z2
name: '(Ising $\times\ \mathcal{M}_m)/\mathbb{Z}_2$'
d: 2
summary: 'Diagonal $\mathbb{Z}_2$ orbifold of Ising $\times\ \mathcal{M}_m$, $m \geq 4$; at $m=4$ it has $\Delta_{\rm gap} = \frac15$.'
tags: [CFT, interacting, unitary, rational, orbifold, family]

description: 'The orbifold by the product of the two spin flips; equivalently the simple-current invariant of $J = \epsilon_{\rm Ising} \otimes \phi_{m-1,1}$. The projection removes $1\otimes\phi_{2,2}$, so the gap is $\phi_{3,3}$: $\Delta_{\rm gap} = \frac{4}{m(m+1)} = \frac23\big(\frac32 - c\big)$.'

parameters:
- symbol: m
  description: 'Label of $\mathcal{M}_m$.'
  range: 'integer $m \geq 4$'

family:
  parameter: m
  start: 4
  formulas:
    c: '3/2 - 6/(m*(m+1))'
    gap: '4/(m*(m+1))'
  show: 8
  overrides:
  - at: 4
    note: '(Ising $\times$ TIM)$/\mathbb{Z}_2$, $\Delta_{\rm gap} = \frac15$. Same torus partition function as the D-type invariant $\mathcal{W}_3(5,6)^D$.'

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac32 - \tfrac{6}{m(m+1)}$ — 2d conformal symmetry, with parity'
  global: 'Contains $\mathbb{Z}_2 \times \mathbb{Z}_2$: the spin flip of one factor (equivalent to that of the other once their product is gauged) and the dual $\mathbb{Z}_2$ of the orbifold, odd on the twisted sector'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '\frac32 - \frac{6}{m(m+1)}'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '\frac{4}{m(m+1)}'
  method: exact

relations:
- type: orbifold_of
  target: ising-x-minimal-a
  note: 'By the diagonal $\mathbb{Z}_2$ (product of the two spin flips).'

references:
- key: bpz1984
  title: Infinite conformal symmetry in two-dimensional quantum field theory
  authors: Belavin, Polyakov, Zamolodchikov
  year: 1984
  journal: Nucl. Phys. B241, 333
  doi: '10.1016/0550-3213(84)90052-X'
- key: ciz1987
  title: 'The A-D-E classification of minimal and $A_1^{(1)}$ conformal invariant theories'
  authors: Cappelli, Itzykson, Zuber
  year: 1987
  journal: Commun. Math. Phys. 113, 1
  doi: '10.1007/BF01221394'
- key: ks1993
  title: Simple currents versus orbifolds with discrete torsion -- a complete classification
  authors: Kreuzer, Schellekens
  year: 1993
  arxiv: hep-th/9306145

contributors: [nathansbenjamin]
