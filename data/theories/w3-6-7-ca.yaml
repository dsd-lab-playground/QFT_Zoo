id: w3-6-7-ca
name: '$\mathcal{W}_3(6,7)^{C_a}$'
d: 2
summary: 'The $\mathcal{W}_3(6,7)$ modular invariant in which charge conjugation acts on the level-3 label only.'
tags: [CFT, interacting, unitary, rational, coset]

description: '$\mathcal{W}_3(6,7) = SU(3)_3\times SU(3)_1/SU(3)_4$.'

symmetry:
  spacetime: '$SO(3,1)$, extended to two Virasoro algebras, $c = \bar c = \tfrac{10}{7}$ — 2d conformal group; parity not recorded'
  global: 'Contains charge conjugation $C: W \to -W$ (gauged in the $C$ orbifold)'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '10/7'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '1/7'
  method: exact

operators:
- name: '\mathcal{O}'
  Delta: '1/7'
  spin: 0
  weights: '(\tfrac{1}{14}, \tfrac{1}{14})'
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: related_to
  target: w3-6-7
  note: 'Same chiral algebra; partial charge conjugation.'

