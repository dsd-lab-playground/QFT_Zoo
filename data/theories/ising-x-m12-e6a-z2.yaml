id: ising-x-m12-e6a-z2
name: '(Ising $\times\ \mathcal{M}_{12}^{(E_6,A)})/\mathbb{Z}_2$'
d: 2
summary: 'Diagonal $\mathbb{Z}_2$ orbifold of Ising $\times\ \mathcal{M}_{12}^{(E_6,A)}$.'
tags: [CFT, interacting, unitary, rational, orbifold]

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac{19}{13}$ — 2d conformal symmetry, with parity'
  global: 'Contains $\mathbb{Z}_2 \times \mathbb{Z}_2$: the spin flip of one factor (equivalent to that of the other once their product is gauged) and the dual $\mathbb{Z}_2$ of the orbifold, odd on the twisted sector'
  parity: true
  global_group:
    - {id: Z2_s, group: Z2, tex: '\mathbb{Z}_2^{s}', note: 'spin flip of one factor; the global symmetry contains the factors declared here; the full group is not recorded'}
    - {id: Z2_dual, group: Z2, tex: '\hat{\mathbb{Z}}_2', note: 'dual symmetry of the orbifold, odd on the twisted sector'}

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '19/13'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '1/13'
  method: exact

operators:
- name: '\mathcal{O}'
  Delta: '1/13'
  spin: 0
  weights: '(\tfrac{1}{26}, \tfrac{1}{26})'
  parity: unknown
  global: {Z2_s: unknown, Z2_dual: unknown}
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: orbifold_of
  target: ising-x-m12-e6a
  note: 'By the diagonal $\mathbb{Z}_2$.'

references:
