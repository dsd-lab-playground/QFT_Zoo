id: qcd-conformal-window-4d
name: QCD in the conformal window
aliases:
  - Banks–Zaks fixed points
  - Caswell–Banks–Zaks fixed points
  - 'Many-flavor QCD (infrared fixed point)'
d: 4
summary: >-
  The infrared fixed points of $SU(3)$ gauge theory with $N_f$ massless Dirac quarks in the
  fundamental representation. They are weakly coupled (Banks–Zaks) just below $N_f = 33/2$,
  where asymptotic freedom is lost; where the window ends at smaller $N_f$ is not settled.
tags: [CFT, interacting, unitary, Lagrangian, gauge theory, family]

description: |
  $SU(N_c)$ Yang–Mills theory coupled to $N_f$ massless Dirac fermions in the fundamental
  representation. With $\alpha = g^2/4\pi$ the beta function is
  $\beta(\alpha) = -2\alpha\,[\,b_1\,\alpha/4\pi + b_2\,(\alpha/4\pi)^2 + \dots]$, with the
  scheme-independent coefficients $b_1$ and $b_2$ below. Asymptotic freedom requires
  $N_f < 11N_c/2$, and $b_2 < 0$ for $N_f > 34N_c^3/(13N_c^2-3)$. In between, the two-loop beta
  function has an infrared zero $\alpha_* = -4\pi b_1/b_2$ [@caswell1974; @banks1982], and the
  massless theory flows from the free UV fixed point to an interacting CFT. Near the upper edge
  $\alpha_*$ is proportional to $\Delta_f = 11N_c/2 - N_f$, so the fixed point is perturbative,
  and its data can be expanded in powers of $\Delta_f$ with scheme-independent coefficients
  [@ryttov2017]. For $SU(3)$ the two-loop zero exists for $9 \le N_f \le 16$, with
  $\alpha_* = 2\pi/151 \approx 0.042$ at $N_f = 16$.

  In the conformal phase the flavor symmetry $SU(N_f)_L\times SU(N_f)_R\times U(1)_V$ is
  unbroken and there is no confinement. The members below are the integer $N_f$ at which the
  two-loop zero exists for $SU(3)$; conformality is controlled near $N_f = 16$ and is
  increasingly uncertain toward $N_f = 9$. The order-$\Delta_f^4$ values of $\gamma_{\bar\psi\psi}$
  quoted for the members are truncations of the $\Delta_f$ series and carry no error
  estimate. Below the lower edge $N_f^*$ the theory confines and breaks chiral symmetry to
  $SU(N_f)_V\times U(1)_V$.

  ### Status of the lower edge
  The conformal window is $N_f^* < N_f < 11N_c/2$, and the value of $N_f^*$ is not known. The
  estimates for $SU(3)$ disagree. The ladder Schwinger–Dyson criterion applied to the two-loop
  fixed point gives $N_f^* = N_c(100N_c^2-66)/(25N_c^2-15)$, just below 12 for $N_c = 3$
  [@appelquist1996], but this approximation is uncontrolled. The
  order-$\Delta_f^4$ values of $\gamma_{\bar\psi\psi}$ stay below the conformal bound
  $\gamma \le 2$ down to $N_f = 9$; assuming the bound is saturated at the lower edge,
  Ryttov and Shrock [@ryttov2016gamma] estimate $8 \lesssim N_f^* \lesssim 9$, while Lee [@lee2021], using the criterion
  $\gamma = 1$, finds $N_f = 10$ likely to lie on the lower edge. Borel resummation of the
  five-loop beta function and of the $\Delta_f$ expansion [@dipietro2020] gives
  substantial evidence that $N_f = 12$ is conformal and weaker indications for $N_f = 11$;
  the method fails below 11.

  On the lattice, $N_f = 12$ has been debated for years. Finite-size scaling analyses find
  conformal behavior with $\gamma_m = 0.235(15)$ [@cheng2014] and $0.235(46)$ [@lombardo2014],
  and LatKMI [@aoki2012] find their data consistent with conformality for $\gamma_m \sim 0.4$–$0.5$.
  Gradient-flow step-scaling studies find an infrared fixed point, at
  $g_\star^2 = 7.3\,({}^{+8}_{-2})$ in the $c = 0.25$ scheme [@hasenfratz2018] and in the
  range $5.2 \le g_c^2 \le 6.4$ [@hasenfratz2019], whereas Fodor et al. [@fodor2016], in the same
  scheme as an earlier study, find no zero of the beta function in the interval
  $6.0 < g^2 < 6.4$ where that study had placed it. For $N_f = 10$, which is "the subject of
  continuing debate", a recent gradient-flow study finds a fixed point at $g^2 = 15.0(5)$ with
  $\gamma_m \simeq 0.6$ [@hasenfratz2023]. For $N_f = 8$ the spectrum indirectly
  indicates chiral symmetry breaking, with a flavor-singlet scalar degenerate with the
  pseudo-Goldstone states at the lightest masses simulated [@lsd2019].

lagrangian: '\mathcal{L} = -\frac{1}{2g^2}\,\mathrm{Tr}\,F_{\mu\nu}F^{\mu\nu} + \sum_{i=1}^{N_f} \bar\psi_i\, i\gamma^\mu D_\mu \psi_i'

parameters:
  - symbol: N_c
    description: Number of colors; the members listed below have $N_c = 3$.
    range: '$N_c \geq 2$'
  - symbol: N_f
    description: Number of massless Dirac fermions in the fundamental representation.
    range: '$N_f^* < N_f < 11N_c/2$; for $SU(3)$ the two-loop zero exists for $9 \le N_f \le 16$'

family:
  parameter: N_f
  members:
    - at: 16
      label: 'Weakest coupling, $\alpha_* \approx 0.042$'
      note: '$\gamma_{\bar\psi\psi} = 0.0259$ at order $\Delta_f^4$.'
    - at: 15
      note: '$\gamma_{\bar\psi\psi} = 0.0843$ at order $\Delta_f^4$.'
    - at: 14
      note: '$\gamma_{\bar\psi\psi} = 0.153$ at order $\Delta_f^4$.'
    - at: 13
      note: '$\gamma_{\bar\psi\psi} = 0.237$ at order $\Delta_f^4$.'
    - at: 12
      label: 'Most studied on the lattice'
      note: '$\gamma_{\bar\psi\psi} = 0.338$ at order $\Delta_f^4$. Conformality favored by most lattice groups and by resummed perturbation theory, but disputed (see Status).'
    - at: 11
      note: '$\gamma_{\bar\psi\psi} = 0.462$ at order $\Delta_f^4$. Resummed perturbation theory weakly favors conformality.'
    - at: 10
      note: '$\gamma_{\bar\psi\psi} = 0.615$ at order $\Delta_f^4$. Lattice fixed point with $\gamma_m \simeq 0.6$ reported in 2023; debated.'
    - at: 9
      note: '$\gamma_{\bar\psi\psi} = 0.804$ at order $\Delta_f^4$. Two-loop coupling $\alpha_* \approx 5.2$; conformality unknown.'

symmetry:
  spacetime: '4d conformal group with parity'
  euclidean: '$O(5,1)$'
  lorentzian: '$O(4,2)$'
  supercharges: 0
  global: '$SU(N_f)_L\times SU(N_f)_R\times U(1)_V$ (the axial $U(1)$ is anomalous), charge conjugation, parity and time reversal'
  gauge: '$SU(N_c)$'

quantities:
  - symbol: 'b_1'
    description: 'One-loop beta-function coefficient, $\beta = -2\alpha\sum_\ell b_\ell(\alpha/4\pi)^\ell$'
    value: '\frac{11N_c - 2N_f}{3}'
    method: derived, one-loop perturbation theory
    refs: [ryttov2016, appelquist1996]
    note: 'Equal to $2\pi b$ with $b$ of Appelquist et al. [@appelquist1996, Eq. (3)]. For $SU(3)$ it is $11 - 2N_f/3$ [@ryttov2016].'
  - symbol: 'b_2'
    description: 'Two-loop beta-function coefficient, same normalization'
    value: '\frac{34}{3}N_c^2 - \frac{13}{3}N_cN_f + \frac{N_f}{N_c}'
    method: derived, two-loop perturbation theory
    refs: [ryttov2016, appelquist1996]
    note: 'Equal to $8\pi^2 c$ with $c$ of Appelquist et al. [@appelquist1996, Eq. (4)]. For $SU(3)$ it is $102 - 38N_f/3$ [@ryttov2016], which vanishes at $N_f = 153/19 \approx 8.05$.'
  - symbol: '\alpha_*'
    description: 'Fixed-point coupling of the two-loop beta function, $-4\pi b_1/b_2$'
    value: '\frac{4\pi N_c(11N_c - 2N_f)}{(13N_c^2-3)N_f - 34N_c^3}'
    method: derived, two-loop perturbation theory
    refs: [ryttov2017, ryttov2016]
    note: 'Scheme dependent beyond leading order in $\Delta_f$. For $SU(3)$: $2\pi/151 \approx 0.0416$ at $N_f = 16$ and $0.754$ at $N_f = 12$, as in [@ryttov2016, Table II].'
  - symbol: '\gamma_{\bar\psi\psi}'
    description: 'Mass anomalous dimension at the fixed point, $\Delta_{\bar\psi\psi} = 3 - \gamma_{\bar\psi\psi}$, in powers of $\Delta_f = 11N_c/2 - N_f$'
    value: '\frac{4(N_c^2-1)}{N_c(25N_c^2-11)}\,\Delta_f + \frac{4(N_c^2-1)(9N_c^2-2)(49N_c^2-44)}{3N_c^2(25N_c^2-11)^3}\,\Delta_f^2 + O(\Delta_f^3)'
    method: BZ, scheme-independent
    refs: [ryttov2017]
    note: 'Eqs. (3.8)–(3.9). For $SU(3)$ through fourth order: $\Delta_f\,[0.049844 + 0.0037928\,\Delta_f + 0.00023747\,\Delta_f^2 + 0.000036789\,\Delta_f^3]$ (eq. 3.13), with $\Delta_f = 33/2 - N_f$.'

operators:
  - name: '\bar\psi\psi\ (N_f = 12)'
    Delta: '2.662'
    spin: 0
    rep: '$SU(N_f)$ adjoint and singlet (same anomalous dimension)'
    method: derived, scheme-independent expansion, fourth order
    refs: [ryttov2017, dipietro2020]
    note: '$3 - \gamma$ with $\gamma = 0.338$ from Table I. Resummed perturbation theory gives $|\gamma| = 0.345(47)$ [@dipietro2020].'
  - name: '\bar\psi\psi\ (N_f = 12)'
    Delta: '2.765(15)'
    spin: 0
    rep: '$SU(N_f)$ adjoint and singlet'
    method: derived, lattice finite-size scaling
    refs: [cheng2014, lombardo2014, aoki2012]
    note: '$3 - \gamma_m$ with $\gamma_m = 0.235(15)$ [@cheng2014]. Also $\gamma_m = 0.235(46)$ [@lombardo2014] and $\gamma_m \sim 0.4$–$0.5$ [@aoki2012].'
  - name: '\mathrm{Tr}\,F_{\mu\nu}F^{\mu\nu}\ (N_f = 12)'
    Delta: '4.228'
    spin: 0
    rep: singlet
    method: derived, scheme-independent expansion, fifth order
    refs: [ryttov2017, hasenfratz2018, dipietro2020]
    note: '$4 + \beta^\prime(\alpha_*)$ (eq. 4.2) with $\beta^\prime = 0.228$ from Table VIII. Lattice: leading irrelevant exponent $0.26(2)$ [@hasenfratz2018]; resummed perturbation theory $0.23(6)$.'
  - name: 'J_\mu^{L},\ J_\mu^{R},\ J_\mu^{V}'
    Delta: 3
    spin: 1
    rep: '$SU(N_f)_L$ and $SU(N_f)_R$ adjoints, $U(1)_V$'
    method: exact
    note: Conserved flavor currents.
  - name: 'T_{\mu\nu}'
    Delta: 4
    spin: 2
    rep: singlet
    method: exact
    note: Stress tensor (conserved).

