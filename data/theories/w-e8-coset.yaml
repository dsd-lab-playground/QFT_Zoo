id: w-e8-coset
name: '$\mathcal{W}(E_8)$ minimal model $E_{8,1}\times E_{8,3}/E_{8,4}$'
d: 2
summary: 'The diagonal coset $(E_8)_1\times(E_8)_3/(E_8)_4$, a minimal model of the $\mathcal{W}(E_8)$ algebra.'
tags: [CFT, interacting, unitary, rational, coset]

description: 'Weights $h = \frac{|p^\prime(\lambda+\rho) - p(\mu+\rho)|^2 - \rho^2}{2pp^\prime}$ at $(p, p^\prime) = (33, 34)$; the gap comes from the $\mathbf{248}$.'

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac{256}{187}$ — 2d conformal symmetry, with parity'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '256/187'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '10/187'
  method: exact

operators:
- name: '\Phi_{(\mathbf{248};\,\mathbf{248})}'
  Delta: '10/187'
  spin: 0
  weights: '(\tfrac{5}{187}, \tfrac{5}{187})'
  note: Lightest non-vacuum Virasoro primary.

references:
- key: gko1985
  title: Virasoro algebras and coset space models
  authors: Goddard, Kent, Olive
  year: 1985
  journal: Phys. Lett. B152, 88
  doi: '10.1016/0370-2693(85)91145-1'
- key: bbss1988
  title: Coset construction for extended Virasoro algebras
  authors: Bais, Bouwknegt, Surridge, Schoutens
  year: 1988
  journal: Nucl. Phys. B304, 371
  doi: '10.1016/0550-3213(88)90632-3'
- key: fkw1992
  title: Characters and fusion rules for W-algebras via quantized Drinfeld-Sokolov reduction
  authors: Frenkel, Kac, Wakimoto
  year: 1992
  journal: Commun. Math. Phys. 147, 295
  doi: '10.1007/BF02096589'

