id: n1-12-e6a
name: '$\mathcal{N}_{12}^{(E_6,A)}$'
aliases: ['$\mathcal{W}_3(6,7)/S_3$']
d: 2
summary: 'Bosonized $\mathcal{N}=1$ minimal model at $m=12$ with the exceptional $(E_6, A)$ invariant.'
tags: [CFT, interacting, unitary, rational, coset, minimal model]

description: 'Same torus partition function as the $S_3$ orbifold $\mathcal{W}_3(6,7)/S_3$.'

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac{10}{7}$ — 2d conformal symmetry; parity not recorded'
  notes: 'Bosonic theory: the $\mathcal{N}=(1,1)$ supercurrents $G$, $\bar G$ have spin $\tfrac32$ and are not local operators here, so the $\mathcal{N}=1$ super-Virasoro symmetry ($OSp(1|2)\times OSp(1|2)$ globally, 2 $Q$ + 2 $S$ supercharges) acts on the fermionic minimal model, not on this bosonization.'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '10/7'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '5/56'
  method: exact

operators:
- name: '\mathcal{O}'
  Delta: '5/56'
  spin: 0
  weights: '(\tfrac{5}{112}, \tfrac{5}{112})'
  note: Lightest non-vacuum Virasoro primary.

