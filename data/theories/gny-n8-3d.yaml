id: gny-n8-3d
name: '3d Gross–Neveu–Yukawa model, $N=8$'
aliases:
  - 'Chiral Ising GNY fixed point, $N=8$'
  - '$O(8)$ Gross–Neveu–Yukawa CFT'
d: 3
summary: >-
  The critical point of 8 two-component Majorana fermions coupled to a real
  pseudoscalar order parameter, with $O(8)$ symmetry. Its chiral cousin describes charge-density-wave ordering in graphene.
tags: [CFT, interacting, unitary, Lagrangian, critical phenomena]

description: |
  $N=8$ Majorana fermions $\psi_i$ (two four-component Dirac fermions) coupled through
  $\phi\,\bar\psi_i\psi_i$ to a real scalar that is odd under parity (time reversal).
  When the scalar orders, the fermions become massive and parity is broken. The
  critical point has a single relevant parity-even singlet, $\epsilon \sim \phi^2$.

  The chiral version describes spin-1/2 fermions on the honeycomb lattice, as in graphene, at a semimetal to charge-density-wave transition. It also describes time-reversal-breaking transitions in $d$-wave superconductors.

  The values below are from the bootstrap of mixed fermion–scalar correlators, which
  confines the theory to an isolated island. They assume that the second parity-odd
  singlet $\sigma'$ is irrelevant; a later bootstrap bounds $\sigma'$ and $\epsilon'$
  above 3 at this $N$, so only $\sigma$ and $\epsilon$ are relevant singlets.
  Lattice models usually realize the closely related chiral GNY class with
  $O(N/2)^2\rtimes\mathbb{Z}_2$ symmetry, whose low-lying dimensions are expected to be
  nearly the same.

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\phi)^2 + \tfrac{1}{2}\bar\psi_i\gamma^\mu\partial_\mu\psi_i + \tfrac{g}{2}\,\phi\,\bar\psi_i\psi_i + \tfrac{1}{2}m^2\phi^2 + \tfrac{\lambda}{4!}\phi^4, \quad i = 1,\dots,8 \text{ Majorana} \quad (m^2 \text{ tuned})'

symmetry:
  spacetime: '3d conformal group with parity'
  euclidean: '$O(4,1)$'
  lorentzian: '$O(3,2)$'
  supercharges: 0
  global: '$O(8)$ and parity / time reversal ($\sigma$ odd)'
  parity: true
  global_group:
    - {id: O(8), group: O(8)}

quantities:
  - symbol: '\eta_\psi'
    description: 'Fermion anomalous dimension, $\Delta_\psi = 1 + \eta_\psi/2$'
    value: '0.04238(11)'
    method: CB
    refs: [erramilli2022]
  - symbol: '\eta_\phi'
    description: 'Order-parameter anomalous dimension, $\eta_\phi = 2\Delta_\sigma - 1$'
    value: '0.7329(27)'
    method: CB
    refs: [erramilli2022]
  - symbol: '\nu^{-1}'
    description: 'Inverse correlation-length exponent, $3 - \Delta_\epsilon$'
    value: '0.998(12)'
    method: CB
    refs: [erramilli2022]
    note: 'So $\nu = 1.002(12)$.'
  - symbol: '\nu^{-1}'
    description: 'Quantum Monte Carlo, $\pi$-flux lattice model (chiral class)'
    value: '1.07(12)'
    method: QMC
    refs: [wangmeng2023]
    note: 'Also $\eta_\phi = 0.72(6)$, $\eta_\psi = 0.04(2)$, consistent with the bootstrap.'

operators:
  - name: '\sigma'
    Delta: '0.8665(13)'
    spin: 0
    parity: odd
    global: {O(8): singlet}
    role: order parameter
    method: CB
    refs: [erramilli2022]
  - name: '\psi_i'
    Delta: '1.02119(5)'
    spin: '1/2'
    parity: unknown
    global: {O(8): vector}
    method: CB
    refs: [erramilli2022]
  - name: '\epsilon'
    Delta: '2.002(12)'
    spin: 0
    parity: even
    global: {O(8): singlet}
    method: CB
    refs: [erramilli2022]
    note: The only relevant parity-even singlet (the tuning parameter).
  - name: 'J_\mu^{[ij]}'
    Delta: 2
    spin: 1
    parity: even
    global: {O(8): adjoint}
    method: exact
    note: Conserved $O(8)$ currents.
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    parity: even
    global: {O(8): singlet}
    method: exact
    note: Stress tensor (conserved).
  - name: '\sigma'''
    Delta: '3.24739(15)'
    spin: 0
    parity: odd
    global: {O(8): singlet}
    method: Padé, large N and N = 1
    refs: [mitchell2024]
  - name: '\sigma'''
    Delta: '[3.189,\ 3.650]'
    spin: 0
    parity: odd
    global: {O(8): singlet}
    method: CB, rigorous bounds
    refs: [mitchell2024]
    note: 'With mild gap assumptions.'
  - name: '\epsilon'''
    Delta: '3.77711(1)'
    spin: 0
    parity: even
    global: {O(8): singlet}
    method: Padé, large N and N = 1
    refs: [mitchell2024]
  - name: '\epsilon'''
    Delta: '[3.167,\ 3.842]'
    spin: 0
    parity: even
    global: {O(8): singlet}
    method: CB, rigorous bounds
    refs: [mitchell2024]
    note: 'With mild gap assumptions.'

relations:
  - type: related_to
    target: gny-n4-3d
    note: 'The $O(N)$ GNY model at another $N$.'
  - type: member_of
    target: gny-3d
    at: 8

