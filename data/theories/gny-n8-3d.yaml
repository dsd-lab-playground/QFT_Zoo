    authors: Ihrig, Mihaila, Scherer
    year: 2018
    journal: Phys. Rev. B 98, 125109
    arxiv: '1806.04977'
  - key: iliesiu2017
    title: Bootstrapping 3D fermions with global symmetries
    authors: Iliesiu, Kos, Poland, Pufu, Simmons-Duffin
    year: 2017
    arxiv: '1705.03484'
  - key: wangmeng2023
    title: Emus live on the Gross-Neveu-Yukawa archipelago
    authors: Wang, Meng
    year: 2023
