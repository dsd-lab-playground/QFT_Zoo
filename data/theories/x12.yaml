id: x12
name: '$\mathcal{X}_{12}$: permutation invariant at $c = \tfrac{19}{13}$'
d: 2
summary: 'A permutation modular invariant of Ising $\times\ \mathcal{M}_{12}^{(E_6,A)}$ that exchanges the Ising factor with a second Ising factor hidden in the $E_6$-extended algebra.'
tags: [CFT, interacting, unitary, rational]

description: 'The chiral algebra is $\mathrm{Vir}_{1/2}\otimes\mathcal{W}$, with $\mathcal{W}$ the $E_6$-extended $\mathcal{M}_{12}$. Rep $\mathcal{W}$ contains a second braided Ising category, generated by $\phi_{5,1}$ ($h=\tfrac92$) and $\phi_{4,1}$ ($h=\tfrac{41}{16}$). Exchanging the two Ising factors is a braided autoequivalence of the representation category, and its graph algebra is a full CFT, with $Z = \sum_i \chi_i \overline{\chi_{\Phi(i)}}$.'

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac{19}{13}$ — 2d conformal symmetry; parity not recorded'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '19/13'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '2/13'
  method: exact

