id: su2-1-orbifold-t
name: '$SU(2)_1/T$ (tetrahedral $c=1$ orbifold)'
aliases: [Ginsparg's tetrahedral point, '$c=1$ exceptional orbifold $T$']
d: 2
summary: 'One of the three isolated $c=1$ CFTs: the orbifold of the self-dual compact boson ($SU(2)_1$) by the tetrahedral group $T \cong A_4$.'
tags: [CFT, unitary, rational, exactly solvable, orbifold]

description: |
  The tetrahedral rotation group $T \cong A_4$ (order 12) acts on the currents $J^a$, $\bar J^a$ of $SU(2)_1$ through the diagonal $SO(3)$. The only invariant marginal operator, $\sum_a J^a \bar J^a$, has a non-zero three-point coefficient, so it is not exactly marginal: unlike the cyclic and dihedral orbifolds (which lie on the circle and orbifold branches), the $T$, $O$, $I$ orbifolds are isolated points of the $c=1$ moduli space (Ginsparg).

  A rotation by angle $2\pi t$ twists the winding by $t$, so its twisted-sector ground state is a scalar Virasoro primary with $h = \bar h = t^2/4$. The smallest rotation in $T$ has order 3, giving $\Delta_{\rm gap} = \frac{1}{2\cdot3^2} = 1/18$; the lightest untwisted invariant has $\Delta = \tfrac12$.

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = 1$ — 2d conformal symmetry; parity not recorded'
  supercharges: 0
  parity: unknown
  global_group: []

