id: conway-module
name: Conway moonshine module
aliases:
  - '$V^{s\natural}$'
  - '$V^{f\natural}$'
  - Supersymmetric moonshine module
  - Super-moonshine module for Conway's group
d: 2
summary: >-
  The unique self-dual holomorphic $\mathcal{N}=1$ super vertex operator algebra with $c = 12$ and no
  weight-$\tfrac12$ fields: a $\mathbb{Z}_2$ orbifold of 24 free chiral fermions. A fermionic theory
  whose symmetries realize moonshine for Conway's group.
tags: [CFT, SCFT, supersymmetric, rational, exactly solvable, orbifold]

description: |
  This is a fermionic theory: a self-dual (holomorphic) super vertex operator algebra (SVOA), with
  states of half-integer weight, $c_L = 12$ and $c_R = 0$. Duncan and Mack-Crane [@dmc2015] proved that it is
  the unique $C_2$-cofinite rational SVOA of CFT type that has central charge 12, is self-dual, and
  has no non-zero states of weight $\tfrac12$. Duncan [@duncan2007] proved the analogous characterization among
  $\mathcal{N}=1$ SVOAs. This is the super analogue of the (open) FLM characterization of the Monster
  CFT by $c = 24$, self-duality and no weight-1 states.

  **Constructions.** (i) Frenkel, Lepowsky and Meurman [@flm1985, Sec. 15] first described it as a $\mathbb{Z}_2$
  orbifold of the SVOA of 8 free fermions and 8 chiral bosons on the $E_8$ lattice, by a lift of $-1$; this removes the
  8 weight-$\tfrac12$ fermions. (ii) Duncan [@duncan2007] built the same space from 24 free chiral fermions, using the
  Golay code, and showed it is isomorphic to (i). (iii) Duncan and Mack-Crane [@dmc2015] realize $V^{s\natural}$ as
  a $\mathbb{Z}_2$ orbifold of the Clifford module SVOA of a 24-dimensional space (24 free fermions); its
  even part is the lattice vertex operator algebra of type $D_{12}$. It has a unique canonically twisted
  (Ramond) module.

  **Character.** In the Neveu–Schwarz sector,
  $$\mathrm{tr}\,q^{L_0 - \frac12} = \frac{\theta_{E_8}(\tau)\,\eta(\tau)^8}{\eta(\tau/2)^8\,\eta(2\tau)^8} - 8
  = q^{-1/2}\prod_{n\geq1}(1+q^{n-1/2})^{24} - 24
  = q^{-1/2} + 276\,q^{1/2} + 2048\,q + 11202\,q^{3/2} + 49152\,q^2 + \dots$$
  (Duncan [@duncan2007, Eq. (1.0.2)]; Witten [@witten2007, Eqs. (3.34)–(3.36)], where it is the function $K$). The middle form, 24
  free fermions minus their 24 weight-$\tfrac12$ states, is derived and agrees with both. The 276 weight-1
  states span $\mathfrak{so}(24)$ ($276 = \dim\mathfrak{so}(24)$, derived), and the weight-$\tfrac32$ space is
  a half-spin module of $\mathrm{Spin}_{24}(\mathbb{R})$ (dimension $2^{11} = 2048$).

  **Supersymmetry and symmetry.** An $\mathcal{N}=1$ supercurrent is a weight-$\tfrac32$ vector, i.e. a
  spinor of $\mathrm{Spin}(24)$, satisfying quadratic conditions; Duncan [@duncan2007] showed such vectors form a
  single orbit, so the $\mathcal{N}=1$ structure is unique. Fixing it breaks the continuous symmetry to a
  finite group: the automorphism group of the $\mathcal{N}=1$ SVOA is $\mathrm{Co}_1$, Conway's largest
  sporadic group [@duncan2007]. Duncan and Mack-Crane [@dmc2015] instead use a faithful action of
  $\mathrm{Co}_0 = \mathrm{Aut}(\Lambda)$, the automorphism group of the Leech lattice, a double cover of
  $\mathrm{Co}_1 = \mathrm{Co}_0/\{\pm1\}$; Witten [@witten2007] describes the symmetry of the SCFT as $\mathrm{Co}_0$.

  **Moonshine and K3.** For every $g \in \mathrm{Co}_0$ the graded supertrace $T^s_g$ on $V^{s\natural}$ is
  the normalized principal modulus of a genus-zero group, the analogue of monstrous moonshine
  [@dmc2015]. It is related to the principal moduli $t_g$ that Conway, Norton and Queen attached to
  $\mathrm{Co}_0$ by $T^s_g(2\tau) = t_g(\tau) + \chi_g$, with $\chi_g$ the trace of $g$ on $\Lambda\otimes\mathbb{C}$.
  The canonically twisted module attaches a weak Jacobi form of weight 0 and index 1 to each symplectic derived autoequivalence of a K3 surface fixing a
  stability condition. These recover the twined elliptic genera of K3 sigma models in all available
  examples, the identity giving the K3 elliptic genus. The supersymmetry-preserving symmetry groups of K3
  sigma models lie in Conway's group [@ghv2012].

symmetry:
  spacetime: '$SO(3,1)$, extended to the $\mathcal{N}=1$ super-Virasoro algebra at $c = 12$ on the holomorphic side only ($\bar c = 0$; global part $OSp(1|2)$) — 2d conformal group, no parity (holomorphic); $\mathcal{N}=1$ superconformal on one side (1 $Q$ + 1 $S$ supercharge)'
  global: '$\mathrm{Co}_1$ (automorphisms of the $\mathcal{N}=1$ structure); $\mathrm{Co}_0$ acts faithfully on $V^{s\natural}$'
  notes: 'Without the $\mathcal{N}=1$ structure, the SVOA carries an action of $\mathrm{Spin}_{24}(\mathbb{R})$, generated by its weight-1 $\mathfrak{so}(24)$ currents. In the Duncan–Mack-Crane action, $-1 \in \mathrm{Co}_0$ acts as fermion parity: by [@dmc2015, Thm. 4.9], $T^s_{-1}(\tau) = q^{-1/2}\prod_n(1+q^{n-1/2})^{24} - 24$, which is the ordinary NS character (derived).'

quantities:
  - symbol: '(c_L,\ c_R)'
    description: 'Left and right central charges (holomorphic theory, so no `c` key)'
    value: '(12,\ 0)'
    method: exact
    refs: [dmc2015, duncan2007]
  - symbol: '\chi_{\rm NS}(\tau)'
    description: 'Neveu–Schwarz-sector character'
    value: 'q^{-1/2}\prod_{n\geq1}(1+q^{n-1/2})^{24} - 24 = q^{-1/2} + 276\,q^{1/2} + 2048\,q + 11202\,q^{3/2} + 49152\,q^2 + 184024\,q^{5/2} + \dots'
    method: exact
    refs: [duncan2007, witten2007]
    note: 'Coefficients as in [@witten2007, Eq. (3.35)]. The product form is derived; it was checked against [@duncan2007, Eq. (1.0.2)] to order $q^{10}$.'
  - symbol: '\dim V_{1/2}'
    description: 'Number of weight-$\tfrac12$ states (free fermions)'
    value: '0'
    method: exact
    refs: [dmc2015, duncan2007]

operators:
  - name: 'G'
    Delta: '3/2'
    spin: '3/2'
    weights: '(\tfrac32, 0)'
    method: exact
    refs: [duncan2007]
    note: '$\mathcal{N}=1$ supercurrent, a $\mathrm{Co}_1$-invariant vector in the 2048-dimensional weight-$\tfrac32$ space.'
  - name: 'J^{ij}'
    Delta: 1
    spin: 1
    weights: '(1, 0)'
    degeneracy: 276
    rep: 'adjoint of $\mathfrak{so}(24)$'
    method: exact
    refs: [dmc2015, witten2007]
    note: 'Fermion bilinears $\lambda^i\lambda^j$; the weight-1 subspace of the $D_{12}$ lattice even part.'

relations:
  - type: related_to
    target: monster-cft
    note: 'Both are "moonshine modules": the Monster CFT for $\mathbb{M}$ ($c = 24$, no weight-1 states) and this SVOA for $\mathrm{Co}_0$ ($c = 12$, no weight-$\tfrac12$ states), with parallel characterizations [@dmc2015].'
  - type: related_to
    target: leech-lattice-cft
    note: 'Its symmetry group $\mathrm{Co}_0$ is the automorphism group of the Leech lattice, which is also the outer automorphism group of the Leech lattice CFT.'

