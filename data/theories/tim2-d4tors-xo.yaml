id: tim2-d4tors-xo
name: '$X_O = \mathrm{TIM}^2/D_4^{\rm tors}$'
aliases: ['$\mathrm{PF}_8/\langle r^4, Cr\rangle^{\rm tors}$']
d: 2
summary: 'Orbifold of TIM$^2$ by its full $D_4$ symmetry with discrete torsion; same torus partition function as $X_E$ but a different CFT.'
tags: [CFT, interacting, unitary, rational, orbifold]

description: 'The symmetry of TIM$^2$ is the dihedral group $D_4$ of order 8 generated by the spin flips $f_1, f_2$ and the exchange $s$. This theory is also $(\mathrm{TIM}^2/\mathbb{Z}_4)/\mathbb{Z}_2$ and $\mathrm{PF}_8/\langle r^4, Cr\rangle^{\rm tors}$.'

