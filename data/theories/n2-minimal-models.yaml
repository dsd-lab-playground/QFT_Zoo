id: n2-minimal-models
name: '$\mathcal{N}=2$ minimal models'
aliases: ['$\mathcal{N}=2$ superconformal minimal models', 'Coset $SU(2)_k\times U(1)_2/U(1)_{k+2}$', 'Kazama–Suzuki model $SU(2)/U(1)$', 'Landau–Ginzburg model $W = \Phi^{k+2}$ (infrared limit)', '$A_{k+1}$ $\mathcal{N}=2$ minimal models']
d: 2
summary: 'The unitary $\mathcal{N}=2$ superconformal theories with $c = \frac{3k}{k+2}$, $k \geq 1$: the coset $SU(2)_k\times U(1)_2/U(1)_{k+2}$ and the infrared limit of the Landau–Ginzburg model $W = \Phi^{k+2}$. This entry is the diagonal (A-series) model.'
tags: [CFT, SCFT, interacting, unitary, supersymmetric, rational, exactly solvable, coset, minimal model, family]

description: |
  The $\mathcal{N}=2$ superconformal algebra has unitary representations with $0 < c < 3$ only at $c = \frac{3k}{k+2}$, $k = 1, 2, \dots$ (Boucher–Friedan–Kent). The minimal model at level $k$ is the coset $\frac{SU(2)_k\times U(1)_2}{U(1)_{k+2}}$ (Di Vecchia–Petersen–Yu–Zheng), the $SU(2)/U(1)$ case of the Kazama–Suzuki construction. Fields are labelled by $(l, m, s)$ with $l = 0, \dots, k$, $m \in \mathbb{Z}_{2(k+2)}$, $s \in \mathbb{Z}_4$, $l + m + s$ even and $(l, m, s) \sim (k-l, m+k+2, s+2)$; even $s$ is the Neveu–Schwarz (NS) sector, odd $s$ the Ramond (R) sector. In the standard range $s \in \{0, 1\}$, $|m - s| \le l$,
  $$h^l_{m,s} = \frac{l(l+2) - m^2}{4(k+2)} + \frac{s}{8}, \qquad q^l_{m,s} = \frac{m}{k+2} - \frac{s}{2},$$
  with $q$ the $U(1)$ R-charge, normalized so that $G^\pm$ have charge $\pm1$.

  The NS chiral primaries are $(l, l, 0)$, with $h = \frac{q}{2} = \frac{l}{2(k+2)}$. Spectral flow by half a unit maps them to the $k+1$ Ramond ground states $(l, l+1, 1)$, with $h = \frac{c}{24}$, the lowest weight allowed in the R sector.

  The A-series model at level $k$ is the conjectured infrared limit of the Landau–Ginzburg model of one chiral superfield with superpotential $W = \Phi^{k+2}$, part of the correspondence between $\mathcal{N}=2$ minimal models and the A-D-E simple singularities (Martinec; Vafa–Warner). Witten tested it by computing characters from the Landau–Ginzburg path integral with twisted boundary conditions. Gepner models, orbifolds of tensor products of minimal models, are exactly solvable points in the moduli spaces of Calabi–Yau sigma models (Gepner).

  ### Modular invariants
  This entry is the diagonal (A-series) model. The often-quoted A-D-E classification of $\mathcal{N}=2$ minimal models applies to the space-time supersymmetric ones, in which spectral flow by half a unit on both sides maps the NS$\otimes$NS sector to the R$\otimes$R sector; their partition functions combine an A, D or E invariant of $SU(2)_k$ with the diagonal invariant of the $U(1)$ factor (Gray, §3.1). Many other partition functions appeared in early work (Gepner; Ravanini–Yang). Without the space-time supersymmetry condition Gannon classified all modular invariant partition functions: the A-D-E labels then group many distinct partition functions (several each for $E_6$, $E_7$, $E_8$), and their number at level $k$ is unbounded as $k$ grows. Gray argued that each is realized by an orbifold of the diagonal model or of an exceptional space-time supersymmetric model.

  ### Spectrum files
  The spectrum files ($k = 1, \dots, 8$) are the bosonic diagonal coset theory
  $$Z = \sum_{(l,m,s)/\sim} |\chi^l_{m,s}|^2,$$
  one term for each of the $2(k+1)(k+2)$ field-identification orbits of the branching functions $\chi^l_{m,s}$. It contains NS$\otimes$NS and R$\otimes$R states with $s_L = s_R$ and no NS$\otimes$R states. This is the diagonal invariant $Z = \sum_{(a,c)\in Q_k}|\chi_{a,c}|^2$ of Cordova–Rizi (their eq. (2.31)) and of Gray (eq. (4) with $M$ the identity), where $\chi_{a,c}$ are the characters of the even and odd fermion-number parts of the $\mathcal{N}=2$ representations. It is the bosonization of the fermionic $\mathcal{N}=2$ minimal model, in which $G^\pm$ are local fields of weight $(\frac32, 0)$: fermionizing the $\mathbb{Z}_2$ generated by the Verlinde line $L_{(k,k+2)}$ gives back the fermionic theory (Chen–Duan–Jia–Lee, supplement A). In the bosonic theory the supercurrents appear only paired with antiholomorphic fermionic states, the lowest being the four states $G^a\bar G^b$ ($a, b = \pm$) at $(h, \bar h) = (\frac32, \frac32)$.

  The blocks are computed from the branching identity $\chi^{SU(2)_k}_l(\tau,z)\,\Theta_{s,2}(\tau,z) = \sum_m \chi^l_{m,s}(\tau)\,\Theta_{m,k+2}(\tau,z)$ (Sugawara, eq. (A.16)) with Weyl–Kac characters, and agree with Sugawara's string-function formula (A.18).

parameters:
- symbol: k
  description: 'Level of $SU(2)_k$ in the coset.'
  range: 'integer $k \geq 1$'

family:
  parameter: k
  start: 1
  formulas:
    c: '3*k/(k+2)'
    gap: '1/(k+2)'
  show: 8
  overrides:
  - at: 1
    gap: '1/12'
    note: '$c = 1$. The Ramond ground states ($\Delta = \frac{1}{12}$) are lighter than the chiral primary ($\Delta = \frac13$). The bosonic theory is the compact boson at $R = 2\sqrt3$ (equivalently $R = 1/\sqrt3$) in the convention of the compact-boson entry; Gray writes $Z_{R=\sqrt6}$, with self-dual radius 1. Checked against the spectrum file.'
  - at: 2
    gap: '1/8'
    note: '$c = \frac32$. The Ramond ground states ($\Delta = \frac18$) are lighter than the chiral primary ($\Delta = \frac14$). The bosonic theory is the Ising model times the compact boson at $R = 2\sqrt2$; Gray writes $Z_{\rm Ising}Z_{R=2}$, with self-dual radius 1. Checked against the spectrum file.'
  - at: 3
    gap: '3/20'
    note: 'The Ramond ground states ($\Delta = \frac{3}{20}$) are lighter than the chiral primary ($\Delta = \frac15$).'

symmetry:
  spacetime: '$\mathcal{N}=(2,2)$ superconformal'
  supercharges: 4
  global: '$U(1)$ R-symmetry on each side (currents $J$, $\bar J$)'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '\frac{3k}{k+2}'
  method: exact
  refs: [bfk1986, gray2012, cordovarizi2025]
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '\min\!\left(\frac{1}{k+2}, \frac{k}{4(k+2)}\right)'
  method: derived
  refs: [cordovarizi2025, gray2012]
  note: 'From the weights: the chiral primary $(1,1,0)$ for $k \geq 4$, the Ramond ground states ($\Delta = \frac{c}{12}$) for $k \leq 3$ (equal at $k = 4$). Confirmed by the spectrum files for $k \leq 8$.'
- symbol: 'N_{\rm prim}'
  description: 'Number of primaries of the bosonic coset theory (field-identification orbits)'
  value: '2(k+1)(k+2)'
  method: exact
  refs: [chen2025]

operators:
- name: '\Phi^l_{l,0}'
  Delta: '\frac{l}{k+2}'
  spin: 0
  weights: '\left(\tfrac{l}{2(k+2)}, \tfrac{l}{2(k+2)}\right)'
  method: exact
  refs: [cordovarizi2025, chen2025]
  note: 'NS chiral primaries ($h = q/2$), $l = 1, \dots, k$ ($l = 0$ is the identity); $l = 1$ is the lightest non-vacuum primary for $k \geq 4$.'
- name: '\Phi^l_{l+1,1}'
  Delta: '\frac{k}{4(k+2)}'
  spin: 0
  weights: '\left(\tfrac{c}{24}, \tfrac{c}{24}\right)'
  method: exact
  refs: [gray2012, cordovarizi2025]
  note: 'Ramond ground states, the spectral flows of the chiral primaries, $l = 0, \dots, k$; the lightest primaries for $k \leq 3$.'
- name: 'J'
  Delta: 1
  spin: 1
  weights: '(1, 0)'
  method: exact
  note: '$U(1)$ R-current.'

relations:
- type: related_to
  target: su2-wzw
  note: 'The coset is built from the $SU(2)_k$ WZW model at the same level $k$.'
- type: related_to
  target: zk-parafermions
  note: 'At the same $k$, the branching functions are sums of products of $\mathbb{Z}_k$ parafermion characters ($\eta$ times $SU(2)_k$ string functions) and $U(1)$ characters $\Theta/\eta$ (Ravanini–Yang; Sugawara, eq. (A.18)); the $\mathcal{N}=2$ representations can also be built from parafermions (Gray, §2.1).'
- type: related_to
  target: compact-boson
  note: 'At $k = 1$ the bosonic theory is the compact boson at $R = 2\sqrt3$; at $k = 2$ it is the Ising model times the compact boson at $R = 2\sqrt2$ (Gray, §2.5; radii converted to the compact-boson convention and checked against the spectrum files).'

