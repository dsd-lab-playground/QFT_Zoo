id: lee-yang-5d
name: '5d Lee–Yang edge singularity CFT'
aliases:
  - Yang–Lee edge singularity (5d)
  - 5d Yang–Lee CFT
  - '$i\phi^3$ fixed point in $d=5$'
d: 5
summary: >-
  The non-unitary CFT at the Lee–Yang edge singularity in five dimensions: the fixed point
  of one scalar with an imaginary cubic coupling, one dimension below its upper critical
  dimension 6. Its only relevant primary, $\phi$, lies just below the unitarity bound.
tags: [CFT, interacting, non-unitary, Lagrangian, critical phenomena]

description: |
  The Lee–Yang edge singularity is the end point of the line of zeros of the Ising
  partition function in an imaginary magnetic field above the critical temperature.
  Fisher described it by a scalar with an imaginary cubic coupling, whose upper critical
  dimension is 6; at and above $d = 6$ the edge exponent takes its mean-field value
  $\sigma = \tfrac12$. In $d = 5$ the fixed point is $\epsilon = 1$ of the $6-\epsilon$
  expansion, and the five-loop resummed exponents have errors in the third decimal or
  below. The same exponents describe lattice animals (branched polymers) in
  $d + 2 = 7$ dimensions (Parisi and Sourlas).

  The only relevant primary is $\phi$; $\phi^2$ is a descendant of $\phi$ by the equation
  of motion (Gliozzi and Rago), and the next scalar primary, "$\phi^3$", is irrelevant but
  only by $\omega \approx 0.7$. The exponents follow from $\Delta_\phi$:
  $$\sigma = \frac{\Delta_\phi}{5 - \Delta_\phi}, \qquad \eta = 2\Delta_\phi - 3 .$$
  $\Delta_\phi \approx 1.42$ lies below the unitarity bound $\Delta \geq \tfrac32$ for a
  5d scalar ($\eta < 0$).

  The estimates below come from methods whose error estimates are not directly
  comparable: the $6-\epsilon$ expansion to five loops with resummation (Borinsky,
  Gracey, Kompaniets and Schnetz); series expansions of the dimer density on the
  hypersimple-cubic and hyper-body-centred-cubic lattices in $d = 5$ (Butera and
  Pernici); the functional renormalization group (An, Mesterházy and Stephanov); and a
  truncated, non-rigorous bootstrap that keeps a few operators in the $\phi\times\phi$
  OPE (Gliozzi and Rago), since the positivity-based numerical bootstrap does not apply to
  a non-unitary theory. For $\sigma$ the five-loop and series values agree within about
  two standard deviations, while the functional RG and the truncated bootstrap are higher
  by about $0.005$ and $0.012$. For $\eta$ the functional RG value differs from the
  five-loop one by about four combined standard deviations.

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\phi)^2 + \tfrac{i\lambda}{3!}\,\phi^3 \quad (\phi \text{ real; the relevant coupling to } \phi \text{ is tuned to the edge})'

symmetry:
  spacetime: conformal
  supercharges: 0
  global: 'None (the Ising $\mathbb{Z}_2$ is broken by the imaginary field)'
  notes: 'Not unitary. The action has a $\mathcal{PT}$ symmetry, $\phi \to -\phi$ combined with $i \to -i$.'

quantities:
  - symbol: '\sigma'
    description: 'Edge exponent, $\sigma = \Delta_\phi/(5-\Delta_\phi)$'
    value: '0.3983(6)'
    method: 'ε-exp, 6 − ε, five loops, resummed'
    refs: [borinsky2021]
    note: 'Combination of all resummations (Table 4); constrained resummations alone give $0.3983(5)$.'
  - symbol: '\sigma'
    description: 'Edge exponent, from the dimer density on the hypersimple-cubic lattice'
    value: '0.401(9)'
    method: series
    refs: [butera2012]
    note: 'Hyper-body-centred-cubic lattice: $0.402(2)$ (Table VI).'
  - symbol: '\sigma'
    description: Edge exponent
    value: '0.4033(12)'
    method: FRG
    refs: [an2016]
  - symbol: '\sigma'
    description: Edge exponent
    value: '0.4105(5)'
    method: CB-trunc
    refs: [gliozzi2014]
  - symbol: '\eta'
    description: 'Anomalous dimension, $\eta = 2\Delta_\phi - 3$'
    value: '-0.151(2)'
    method: 'ε-exp, 6 − ε, five loops, resummed'
    refs: [borinsky2021, an2016]
    note: 'Table 1. Functional renormalization group: $-0.126(6)$ (An et al.).'
  - symbol: '\omega'
    description: 'Leading correction-to-scaling exponent, $\omega = \Delta_{\phi^3} - 5$'
    value: '0.691(8)'
    method: 'ε-exp, 6 − ε, five loops, resummed'
    refs: [borinsky2021]
    note: 'Table 6. Only unconstrained resummations are available, and the authors caution that no definite conclusions should be drawn for $\omega$.'

operators:
  - name: '\phi'
    Delta: '1.4245(10)'
    spin: 0
    rep: the only relevant primary
    method: derived
    refs: [borinsky2021, arguellocruz2025]
    note: '$(3+\eta)/2$ with the five-loop $\eta = -0.151(2)$. Below the unitarity bound $\tfrac32$. Two-sided Padé of the $6-\epsilon$ series: $1.425$ (Arguello Cruz et al., Table 2).'
  - name: 'T_{\mu\nu}'
    Delta: 5
    spin: 2
    method: exact
    note: Stress tensor (conserved).
  - name: '\phi^3'
    Delta: '5.691(8)'
    spin: 0
    method: derived
    refs: [borinsky2021, arguellocruz2025, gliozzi2014]
    note: 'Leading irrelevant scalar, $5 + \omega$ with the five-loop $\omega$. Two-sided Padé: $5.701$ and $5.702$ (Arguello Cruz et al., Table 2). The truncated bootstrap gives $6.4(1)$ (Gliozzi and Rago).'

relations:
  - type: related_to
    target: lee-yang-4d
    note: 'The same universality class in four dimensions. Both are continuations of the $i\phi^3$ fixed point from $d = 6-\epsilon$, with $\epsilon = 1$ here and $\epsilon = 2$ there.'

