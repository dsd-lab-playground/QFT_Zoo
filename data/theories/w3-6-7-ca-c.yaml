id: w3-6-7-ca-c
name: '$\mathcal{W}_3(6,7)^{C_a}/C$'
d: 2
summary: 'Orbifold of $\mathcal{W}_3(6,7)^{C_a}$ by charge conjugation $W \to -W$; the gap comes from the twisted-sector ground state.'
tags: [CFT, interacting, unitary, rational, orbifold]

description: 'It has the same gap as $\mathcal{N}_{12}^{(E_6,A)}$ but a different partition function.'

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac{10}{7}$ — 2d conformal symmetry; parity not recorded'
  global: 'Contains the dual $\mathbb{Z}_2$ of the orbifold, odd on the $C$-twisted sector'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '10/7'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '5/56'
  method: exact

operators:
- name: '\tau_C'
  Delta: '5/56'
  spin: 0
  weights: '(\tfrac{5}{112}, \tfrac{5}{112})'
  note: 'Twisted-sector ground state; lightest non-vacuum primary.'

relations:
- type: orbifold_of
  target: w3-6-7-ca
  note: By charge conjugation.

