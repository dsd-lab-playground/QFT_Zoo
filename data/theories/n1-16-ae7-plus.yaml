id: n1-16-ae7-plus
name: '$\mathcal{N}_{16}^{(A,E_7)+}$'
aliases: ['$\mathcal{N}_{16}^{(D,E_7)+}$']
d: 2
summary: 'Bosonized $\mathcal{N}=1$ minimal model at $m=16$ with the exceptional $(A, E_7)$ invariant, GSO choice $+$.'
tags: [CFT, interacting, unitary, rational, coset, minimal model]

description: 'The $(A, E_7)$ and $(D, E_7)$ invariants have identical invariant matrices on the coset fields. The gap comes from the NS field $(5,5)$.'

symmetry:
  spacetime: '$SO(3,1)$, extended to two Virasoro algebras, $c = \bar c = \tfrac{35}{24}$ — 2d conformal group; parity not recorded'
  notes: 'Bosonic theory: the $\mathcal{N}=(1,1)$ supercurrents $G$, $\bar G$ have spin $\tfrac32$ and are not local operators here, so the $\mathcal{N}=1$ super-Virasoro symmetry ($OSp(1|2)\times OSp(1|2)$ globally, 2 $Q$ + 2 $S$ supercharges) acts on the fermionic minimal model, not on this bosonization.'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '35/24'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '1/12'
  method: exact

operators:
- name: '\Phi_{5,5}'
  Delta: '1/12'
  spin: 0
  weights: '(\tfrac{1}{24}, \tfrac{1}{24})'
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: related_to
  target: n1-16-ae7-minus
  note: Opposite GSO choice.
- type: related_to
  target: n1-minimal-aa-even
  at: 16
  note: 'Exceptional invariant at $m=16$.'

references:
- key: cappelli1987
  title: Modular invariant partition functions of superconformal theories
  authors: Cappelli
  year: 1987
  journal: Phys. Lett. B185, 82
  doi: '10.1016/0370-2693(87)91532-2'
- key: fqs1985
  title: Superconformal invariance in two dimensions and the tricritical Ising model
  authors: Friedan, Qiu, Shenker
  year: 1985
  journal: Phys. Lett. B151, 37
  doi: '10.1016/0370-2693(85)90819-6'

contributors: [nathansbenjamin]
