id: minimal-ad-4d
name: Minimal Argyres–Douglas theory
aliases:
  - '$H_0$ theory'
  - '$(A_1, A_2)$ Argyres–Douglas theory'
  - 'Argyres–Douglas point of pure $SU(3)$'
d: 4
summary: >-
  The rank-one Argyres–Douglas SCFT with no flavor symmetry and a Coulomb-branch operator of
  dimension $6/5$. Its $c = 11/30$ is the smallest allowed for an interacting $\mathcal{N}=2$
  SCFT, and its chiral algebra is conjectured to be the Lee–Yang minimal model.
tags: [CFT, SCFT, interacting, unitary, supersymmetric, non-Lagrangian]

description: |
  The infrared SCFT at the $\mathbb{Z}_3$ point of pure $\mathcal{N}=2$ $SU(3)$ gauge theory,
  where mutually non-local dyons become massless [@argyres1995]. Argyres, Plesser,
  Seiberg and Witten [@argyres1995b] found the same SCFT in $SU(2)$ with one flavor, at the point where a
  monopole and a quark become massless together. It is isolated (no exactly marginal
  deformations), has rank one and a trivial Higgs branch, and no flavor symmetry. Its
  Coulomb-branch chiral ring is generated by $u$ with $\Delta_u = 6/5$, and the coupling of the
  relevant deformation paired with $u$ has dimension $2 - \Delta_u = 4/5$.

  Liendo, Ramírez and Seo [@liendo2015] showed from the stress-tensor OPE and the chiral algebra that any
  interacting $\mathcal{N}=2$ SCFT without higher-spin currents has $c \geq 11/30$; this theory
  saturates the bound. It also has the smallest $a$ among the rank-one SCFTs of the
  Seiberg–Witten-geometry classification, assuming the Coulomb-branch chiral ring is freely
  generated [@cornagliotto2017]. Its chiral algebra has $c_{2d} = -12c = -22/5$ and
  is conjectured to be the Virasoro vertex algebra of the Lee–Yang minimal model
  $\mathcal{M}(2,5)$. Beem and Rastelli [@beem2017] place it as the $\mathfrak{a}_0$ (trivial Lie algebra)
  entry of the Deligne–Cvitanović series of vertex algebras, whose
  $\mathfrak{a}_1, \mathfrak{a}_2, \mathfrak{d}_4, \mathfrak{e}_6, \mathfrak{e}_7, \mathfrak{e}_8$
  entries are the other rank-one theories on a D3-brane at an F-theory singularity. Córdova and
  Shao [@cordova2015] found that the Schur index equals the vacuum character of
  $\mathcal{M}(2,5)$, using their conjectured relation between the Schur index and the BPS
  spectrum, and the saturation of the $c$ bound matches the level-four null state of the
  Lee–Yang vacuum module.

  Maruyoshi and Song [@maruyoshi2016a] gave an $\mathcal{N}=1$ gauge theory that flows to this SCFT, with
  supersymmetry enhanced to $\mathcal{N}=2$. Starting from $SU(2)$ with four flavors, they
  couple an adjoint chiral multiplet $M$ of $SO(8)$ through $W = \mathrm{Tr}\,M\mu$ and give $M$
  a principal nilpotent expectation value. What remains is an $SU(2)$ gauge theory with an
  adjoint chiral, two fundamental chirals and gauge-singlet chirals. a-maximization, after
  removing the operators that violate the unitarity bound and decouple as free fields, gives
  $a = 43/120$, $c = 11/30$ and a singlet of dimension $6/5$. The infrared theory is this SCFT
  plus free chiral multiplets, and the description gives the full superconformal index.

  The numerical bootstrap of $\langle u\,\bar u\,u\,\bar u\rangle$ with $\Delta_u$ and $c$ as
  input [@cornagliotto2017; @gimenezgrau2020] gives narrow two-sided bounds
  on the OPE coefficient of $u^2$ and estimates of unprotected dimensions. The lower bound on
  $c$ at $\Delta_u = 6/5$ is consistent with converging to $11/30$, but this is not conclusive.

symmetry:
  spacetime: '$\mathcal{N}=2$ superconformal, $SU(2,2|2)$'
  supercharges: 8
  global: 'No flavor symmetry; R-symmetry $SU(2)_R\times U(1)_r$'

quantities:
  - key: a
    symbol: 'a'
    description: 'Euler conformal anomaly (normalized so a free real scalar has $a = \tfrac{1}{360}$)'
    value: '\frac{43}{120}'
    method: exact, Seiberg–Witten geometry
    refs: [shapere2008, aharony2007]
    note: '[@shapere2008, Eqs. (4.32), (4.45); @aharony2007, Table 2]. Reproduced by a-maximization in the $\mathcal{N}=1$ Lagrangian of Maruyoshi and Song [@maruyoshi2016a].'
  - symbol: 'c'
    description: 'Weyl conformal anomaly (normalized so a free real scalar has $c = \tfrac{1}{120}$)'
    value: '\frac{11}{30}'
    method: exact, Seiberg–Witten geometry
    refs: [shapere2008, aharony2007, liendo2015]
    note: 'Saturates the bound $c \geq \tfrac{11}{30}$ for interacting $\mathcal{N}=2$ SCFTs [@liendo2015, Eq. (4.14)].'
  - symbol: '\lambda^2_{u^2}'
    description: 'Squared OPE coefficient of $u^2$ in $u\times u$ (unit-normalized two-point functions)'
    value: '[2.142596,\ 2.16509]'
    method: CB, rigorous bounds
    refs: [gimenezgrau2020, cornagliotto2017]
    note: 'Bounds at derivative order $\Lambda = 50$ [@gimenezgrau2020, Table 7]. Earlier: $2.1418 \le \lambda^2 \le 2.1672$ at $\Lambda = 40$, with conservative extrapolation $2.146 \lesssim \lambda^2 \lesssim 2.159$ [@cornagliotto2017, Eqs. (3.1), (3.2)].'

operators:
  - name: 'u'
    Delta: '\frac{6}{5}'
    spin: 0
    rep: '$SU(2)_R$ singlet'
    method: exact
    refs: [argyres1995b, aharony2007]
    note: 'Generator of the Coulomb-branch chiral ring.'
  - name: 'u^2'
    Delta: '\frac{12}{5}'
    spin: 0
    rep: '$SU(2)_R$ singlet'
    method: exact
    refs: [cornagliotto2017]
    note: 'Coulomb-branch chiral operator; dimensions add in the chiral ring.'
  - name: '[u\bar u]_{\rm long}'
    Delta: '\approx 2.56\text{–}2.68'
    spin: 0
    rep: '$SU(2)_R$ singlet, $U(1)_r$ neutral'
    method: CB-EFM
    refs: [cornagliotto2017, gimenezgrau2020]
    note: 'Superconformal primary of the lightest long multiplet in $u\times\bar u$; relevant. Range from extrapolations to $\Lambda\to\infty$ [@cornagliotto2017, Eq. (3.5)], not a rigorous bound. Gimenez-Grau and Liendo [@gimenezgrau2020, Eq. (4.1)] find $\approx 2.7$.'
  - name: 'T_{\mu\nu}'
    Delta: 4
    spin: 2
    rep: singlet
    method: exact
    note: Stress tensor (conserved).

