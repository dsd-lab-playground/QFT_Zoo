  target: compact-boson
  note: 'Member $k = 1$ is the compact boson at the self-dual radius $R = \sqrt2$ (the same CFT).'
- type: related_to
  target: zk-parafermions
  note: 'The coset $SU(2)_k/U(1)$ of member $k$ is $\mathrm{PF}_k$.'
- type: related_to
  target: virasoro-minimal-a
  note: 'The coset $SU(2)_k \times SU(2)_1/SU(2)_{k+1}$ gives the minimal model with $m = k+2$.'

