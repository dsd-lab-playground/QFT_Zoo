id: o3-model-3d
name: 3d $O(3)$ model
aliases:
  - Heisenberg universality class
  - '$O(3)$ Wilson–Fisher fixed point'
  - Critical 3d Heisenberg model
d: 3
uv_dof: 3
summary: >-
  The conformal field theory of the 3d Heisenberg universality class: the
  infrared fixed point of three real scalars with an $O(3)$-invariant quartic
  interaction. It describes the Curie transition of isotropic magnets.
tags: [CFT, interacting, unitary, Lagrangian, critical phenomena]

description: |
  Describes the ferromagnetic and antiferromagnetic transitions of isotropic
  (Heisenberg) magnets. In $2+1$ dimensions it describes the transition between
  Néel order and a paramagnet in dimerized quantum antiferromagnets. It is the IR
  endpoint of the flow from three free real scalars triggered by the
  $O(3)$-invariant quartic coupling, with the mass tuned to criticality.

  The lightest scalars are the vector $\phi$ (the order parameter), the rank-2
  symmetric traceless tensor $t$, and the singlet $s$ (the thermal operator). The
  tensor $t$ is a uniaxial anisotropy, and it is strongly relevant. An easy axis
  drives the flow to the 3d Ising CFT, and an easy plane drives it to the 3d
  $O(2)$ model.

  The lightest rank-4 scalar $t_4$ is relevant, but only barely: the bootstrap
  proves $\Delta_{t_4} < 2.99056$, and Monte Carlo gives $\Delta_{t_4} = 2.9858(6)$.
  So the $O(3)$ fixed point is unstable to cubic anisotropy, and magnets on a cubic
  lattice ultimately flow to the cubic fixed point. The flow is extremely slow, and
  the critical exponents barely change: $\nu_{\rm cubic} - \nu_{O(3)} = -0.00061(10)$.

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\vec\phi)^2 + \tfrac{1}{2} m^2 \vec\phi^{\,2} + \tfrac{\lambda}{4!}(\vec\phi^{\,2})^2, \quad \vec\phi\in\mathbb{R}^3 \quad (m^2 \text{ tuned to criticality, flow to the IR})'

symmetry:
  spacetime: conformal
  supercharges: 0
  global: '$O(3)$'

quantities:
  - symbol: '\nu'
    description: 'Correlation-length exponent, $\nu = 1/(3-\Delta_s)$'
    value: '0.71164(10)'
    method: MC, improved icosahedral model
    refs: [hasenbusch2020]
    note: 'Conformal bootstrap: $0.71168(41)$ (rigorous) [@chester2020].'
  - symbol: '\eta'
    description: 'Anomalous dimension, $\eta = 2\Delta_\phi - 1$'
    value: '0.03784(5)'
    method: MC, improved icosahedral model
    refs: [hasenbusch2020]
    note: 'Conformal bootstrap: $0.03787(13)$ (rigorous) [@chester2020].'
  - symbol: '\alpha'
    description: 'Specific-heat exponent, $\alpha = 2 - 3\nu$'
    value: '-0.1349(3)'
    method: derived, from ν
    refs: [hasenbusch2020]
  - symbol: '\omega'
    description: 'Leading correction-to-scaling exponent, $\omega = \Delta_{s^\prime} - 3$'
    value: '0.759(2)'
    method: MC
    refs: [hasenbusch2020]
  - symbol: 'Y_4'
    description: 'RG eigenvalue of the cubic perturbation, $Y_4 = 3 - \Delta_{t_4}$'
    value: '0.0142(6)'
    method: MC
    refs: [hasenbusch2023]
  - symbol: 'C_T/C_T^{\rm free}'
    description: 'Stress-tensor two-point coefficient, relative to three free real scalars'
    value: '0.944524(28)'
    method: CB, non-rigorous error
    refs: [chester2020]
  - symbol: 'C_J/C_J^{\rm free}'
    description: 'Current two-point coefficient, relative to three free real scalars'
    value: '0.90632(16)'
    method: CB, non-rigorous error
    refs: [chester2020]
  - symbol: '\lambda_{\phi\phi s}'
    description: OPE coefficient
    value: '0.524261(59)'
    method: CB, non-rigorous error
    refs: [chester2020]
  - symbol: '\lambda_{sss}'
    description: OPE coefficient
    value: '0.5055(11)'
    method: CB, non-rigorous error
    refs: [chester2020]
  - symbol: '\lambda_{tts}'
    description: OPE coefficient
    value: '0.98348(39)'
    method: CB, non-rigorous error
    refs: [chester2020]
  - symbol: '\lambda_{\phi\phi t}'
    description: OPE coefficient
    value: '0.87451(22)'
    method: CB, non-rigorous error
    refs: [chester2020]
  - symbol: '\lambda_{ttt}'
    description: OPE coefficient
    value: '1.49957(49)'
    method: CB, non-rigorous error
    refs: [chester2020]

operators:
  - name: '\phi_i'
    Delta: '0.51892(3)'
    spin: 0
    rep: vector (order parameter)
    method: MC
    refs: [hasenbusch2020]
    note: 'Bootstrap: $0.518936(67)$ (rigorous).'
  - name: 't_{ij}'
    Delta: '1.20954(32)'
    spin: 0
    rep: rank-2 symmetric traceless
    method: CB
    refs: [chester2020, hasenbusch2011]
    note: 'Monte Carlo: $1.2094(3)$ [@hasenbusch2011]. Uniaxial anisotropy; relevant.'
  - name: 's'
    Delta: '1.5948(2)'
    spin: 0
    rep: singlet (thermal)
    method: MC
    refs: [hasenbusch2020]
    note: 'Bootstrap: $1.59488(81)$ (rigorous).'
  - name: 'J_\mu^{[ij]}'
    Delta: 2
    spin: 1
    rep: antisymmetric (adjoint)
    method: exact
    note: Conserved $O(3)$ currents.
  - name: 't_4'
    Delta: '2.9858(6)'
    spin: 0
    rep: rank-4 symmetric traceless
    method: MC
    refs: [hasenbusch2023]
    note: 'Bootstrap bound $\Delta_{t_4} < 2.99056$ (rigorous) [@chester2020]. Relevant, so cubic anisotropy destabilizes the fixed point.'
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    rep: singlet
    method: exact
    note: Stress tensor (conserved).
  - name: "s'"
    Delta: '3.759(2)'
    spin: 0
    rep: singlet
    method: MC, 3 + ω
    refs: [hasenbusch2020]
    note: Leading irrelevant singlet; controls corrections to scaling.

relations:
  - type: flows_to
    target: trivial-tqft-3d
    note: 'Singlet mass deformation $t\,\phi_a\phi_a$ on the disordered (high-temperature) side: gapped, with $O(3)$ unbroken. The other sign breaks $O(3)$ to $O(2)$ and leaves two Goldstone bosons, not this theory. Pelissetto and Vicari [@pelissetto2002] review the phases of these models.'
  - type: flows_to
    target: ising-3d
    note: 'Uniaxial anisotropy (the rank-2 operator $t$) favouring an easy axis, with the mass tuned to criticality.'
  - type: flows_to
    target: o2-model-3d
    note: 'Uniaxial anisotropy (the rank-2 operator $t$) favouring an easy plane, with the mass tuned to criticality.'
  - type: member_of
    target: on-model-3d
    at: 3
  - type: flows_to
    target: cubic-3d
    note: 'Cubic anisotropy (the cubic-invariant component of the rank-4 traceless symmetric operator), which is relevant at the $O(3)$ fixed point, with the mass tuned to criticality.'

references:
