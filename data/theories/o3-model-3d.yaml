    year: 2020
    journal: Phys. Rev. B 102, 024406
    arxiv: '2005.04448'
  - key: hasenbusch2023
    title: 'Cubic fixed point in three dimensions: Monte Carlo simulations of the $\phi^4$ model on the lattice'
    authors: Hasenbusch
    year: 2023
    journal: Phys. Rev. B 107, 024409
    arxiv: '2211.16170'
  - key: hasenbusch2011
    title: Anisotropic perturbations in three-dimensional O(N)-symmetric vector models
    authors: Hasenbusch, Vicari
    year: 2011
    journal: Phys. Rev. B 84, 125136
    arxiv: '1108.0491'
  - key: kos2016
    title: Precision islands in the Ising and $O(N)$ models
    authors: Kos, Poland, Simmons-Duffin, Vichi
    year: 2016
    arxiv: '1603.04436'
  - key: wilson1972
