id: pf5
name: '$\mathrm{PF}_5$ ($\mathbb{Z}_5$ parafermions)'
d: 2
summary: 'The $\mathbb{Z}_5$ parafermion CFT $SU(2)_5/U(1)$ with the diagonal invariant; the lowest central charge above $c = 1$ among the theories listed here.'
tags: [CFT, interacting, unitary, rational, coset]

symmetry:
  spacetime: '$O(3,1)$, extended to two Virasoro algebras, $c = \bar c = \tfrac87$ — 2d conformal group with parity'
  supercharges: 0
  global: 'Dihedral $D_{5}$: $\mathbb{Z}_{5}$ rotations $r$ and charge conjugation $C$'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '8/7'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '4/35'
  method: exact

operators:
- name: '\Phi^1_{\pm1}'
  Delta: '4/35'
  spin: 0
  weights: '(\tfrac{2}{35}, \tfrac{2}{35})'
  degeneracy: 2
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: member_of
  target: zk-parafermions
  at: 5

references:
