id: n1-30-e8a
name: '$\mathcal{N}_{30}^{(E_8,A)}$'
aliases: ['$\mathcal{N}_{30}^{(E_8,D)}$']
d: 2
summary: 'Bosonized $\mathcal{N}=1$ minimal model at $m=30$ with an exceptional $E_8$ invariant.'
tags: [CFT, interacting, unitary, rational, coset, minimal model]

description: 'The $(A, E_8)$ and $(D, E_8)$ (respectively $(E_8, A)$ and $(E_8, D)$) invariants coincide on the coset fields. The gap comes from the NS field $(7,7)$.'

symmetry:
  spacetime: '$SO(3,1)$, extended to two Virasoro algebras, $c = \bar c = \tfrac{119}{80}$ — 2d conformal group; parity not recorded'
  notes: 'Bosonic theory: the $\mathcal{N}=(1,1)$ supercurrents $G$, $\bar G$ have spin $\tfrac32$ and are not local operators here, so the $\mathcal{N}=1$ super-Virasoro symmetry ($OSp(1|2)\times OSp(1|2)$ globally, 2 $Q$ + 2 $S$ supercharges) acts on the fermionic minimal model, not on this bosonization.'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '119/80'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '1/20'
  method: exact

operators:
- name: '\Phi_{7,7}'
  Delta: '1/20'
  spin: 0
  weights: '(\tfrac{1}{40}, \tfrac{1}{40})'
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: related_to
  target: n1-minimal-aa-even
  at: 30
  note: 'Exceptional invariant at $m=30$.'

references:
