  title: Modular invariant partition functions of superconformal theories
  authors: Cappelli
  year: 1987
  journal: Phys. Lett. B185, 82
  doi: '10.1016/0370-2693(87)91532-2'
- key: fqs1985
  title: Superconformal invariance in two dimensions and the tricritical Ising model
  authors: Friedan, Qiu, Shenker
  year: 1985
  journal: Phys. Lett. B151, 37
  doi: '10.1016/0370-2693(85)90819-6'

