id: free-fermion-3d
name: '3d free Majorana fermion'
aliases:
  - 'Free massless Majorana fermion (3d)'
  - Free Dirac fermion (3d)
  - Free two-component fermion
d: 3
summary: >-
  A free massless two-component Majorana fermion in three dimensions; two of them
  form a free Dirac fermion. The free Dirac fermion is a node of the 3d duality web:
  it is dual to the $O(2)$ Wilson–Fisher fixed point coupled to $U(1)_1$ Chern–Simons theory.
tags: [CFT, free, unitary, Lagrangian, exactly solvable]

description: |
  A two-component Majorana fermion $\psi$ has $\Delta_\psi = 1$. Its mass operator
  $\bar\psi\psi$ ($\Delta = 2$) is odd under parity and time reversal, so these
  symmetries forbid a mass. A gapless Majorana fermion protected by time reversal
  appears on the surface of a $3+1$d topological superconductor [@grover2014]. Coupling $N$ Majorana fermions to a real pseudoscalar through
  $\phi\,\bar\psi_i\psi_i$, with the scalar mass tuned, gives the $O(N)$
  Gross–Neveu–Yukawa fixed points.

  Two Majorana fermions form one two-component Dirac fermion $\Psi$, with an $O(2)$
  symmetry ($U(1)$ charge and charge conjugation). Data below are per Majorana fermion
  unless stated; for a Dirac fermion $F$ and $C_T$ are twice as large. A single Dirac
  fermion has the parity anomaly: with its $U(1)$ coupled to a background gauge field it
  is time-reversal invariant only as the boundary of a $3+1$d topological insulator
  [@seiberg2016].

  ### Duality web
  Seiberg, Senthil, Wang and Witten [@seiberg2016] take as a seed the duality between a free Dirac
  fermion coupled to a background spin$^c$ connection $A$ and the $O(2)$ Wilson–Fisher
  scalar whose $U(1)$ is gauged by a dynamical $b$ with a level-1 Chern–Simons term,
  $$i\bar\Psi\gamma^\mu D^{A}_\mu\Psi \;\longleftrightarrow\; |D_b\phi|^2 - |\phi|^4 + \tfrac{1}{4\pi}\,b\,db + \tfrac{1}{2\pi}\,b\,dA .$$
  Gauging background fields and adding Chern–Simons counterterms then gives a web of
  dualities [@seiberg2016; @karch2016], including bosonic
  particle–vortex duality (the $O(2)$ model and scalar QED$_3$) and its fermionic
  counterpart, which relates the free Dirac fermion to a Dirac fermion coupled to a
  dynamical $U(1)$ gauge field. The fermionic version was proposed by Son [@son2015] for the
  half-filled Landau level, and by Wang and Senthil [@wangsenthil2015] and by Metlitski and Vishwanath [@mv2016] for
  topological-insulator surfaces; Seiberg et al. [@seiberg2016] give it
  with properly quantized Chern–Simons terms. These are infrared dualities, conjectured
  rather than proven.

lagrangian: '\mathcal{L} = \tfrac{1}{2}\bar\psi\gamma^\mu\partial_\mu\psi \quad (\text{one Majorana}), \qquad \mathcal{L} = \bar\Psi\gamma^\mu\partial_\mu\Psi \quad (\text{one Dirac} = \text{two Majorana})'

symmetry:
  spacetime: '$O(4,1)$ — 3d conformal group with parity'
  supercharges: 0
  global: 'fermion parity $(-1)^F$, parity and time reversal; $O(2)$ for a Dirac fermion'
  notes: 'Time reversal forbids the mass $\bar\psi\psi$. The Dirac fermion has a parity anomaly between $U(1)$ and time reversal.'

quantities:
  - key: F
    symbol: 'F'
    description: '$S^3$ free energy of one Majorana fermion, $F = -\log|Z_{S^3}|$'
    value: '\frac{\log 2}{8} + \frac{3\zeta(3)}{16\pi^2} \approx 0.110'
    method: exact
    refs: [klebanov2011, fei2016]
    note: 'Half the Dirac value.'
  - symbol: 'F_{\rm Dirac}'
    description: '$S^3$ free energy of one two-component Dirac fermion'
    value: '\frac{\log 2}{4} + \frac{3\zeta(3)}{8\pi^2} \approx 0.219'
    method: exact
    refs: [klebanov2011]
  - symbol: 'C_T/C_T^{\rm free}'
    description: 'Stress-tensor two-point coefficient of one Majorana fermion, relative to one free real scalar'
    value: '1'
    method: derived
    refs: [osborn1993, diab2016, fei2016]
    note: 'From $C_T^{\rm sc} = \frac{d}{(d-1)S_d^2}$ and $C_T^{\rm fer} = {\rm Tr}\,\mathbb{1}\,\frac{d}{2S_d^2}$ with ${\rm Tr}\,\mathbb{1} = 2$, a two-component Dirac fermion has twice the $C_T$ of a real scalar (as also used by Fei et al. [@fei2016]); a Majorana fermion has half of that.'

operators:
  - name: '\psi'
    Delta: 1
    spin: '1/2'
    rep: 'fermion, $(-1)^F$ odd'
    method: exact
    refs: [iliesiu2017]
  - name: '\bar\psi\psi'
    Delta: 2
    spin: 0
    rep: odd under parity and time reversal
    method: exact
    refs: [diab2016, erramilli2022]
    note: 'The mass term; for $N$ Majorana fermions the $O(N)$ singlet $\bar\psi_i\psi_i$.'
  - name: 'J_\mu'
    Delta: 2
    spin: 1
    rep: Dirac fermion only
    method: exact
    note: 'Conserved $U(1)$ current, $\bar\Psi\gamma_\mu\Psi$.'
  - name: 'T_{\mu\nu}'
    Delta: 3
    spin: 2
    rep: singlet
    method: exact
    note: Stress tensor (conserved).

relations:
  - type: related_to
    target: gny-3d
    note: '$N$ free Majorana fermions plus a real scalar with a Yukawa coupling flow to the GNY fixed point; the Gross–Neveu UV fixed point flows back to $N$ free Majorana fermions.'
  - type: related_to
    target: o2-model-3d
    note: 'A free Dirac fermion is dual to the $O(2)$ Wilson–Fisher fixed point with its $U(1)$ gauged at Chern–Simons level 1 [@seiberg2016].'

