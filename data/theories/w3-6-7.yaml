id: w3-6-7
name: '$\mathcal{W}_3(6,7)$ minimal model'
d: 2
summary: 'The $p=6$ unitary $\mathcal{W}_3$ minimal model with the diagonal invariant.'
tags: [CFT, interacting, unitary, rational, coset, minimal model]

description: '$\mathcal{W}_3(6,7) = SU(3)_3\times SU(3)_1/SU(3)_4$. Its modular invariants (Beltaos–Gannon) are the diagonal one, a $\mathbb{Z}_3$ extension $D$ (from $SU(3)_3 \subset SO(8)_1$) and the partial conjugation $C_a$ acting on the level-3 label only.'

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac{10}{7}$ — 2d conformal symmetry, with parity'
  supercharges: 0
  global: '$S_3$ ($\mathbb{Z}_3$ and $C: W \to -W$)'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '10/7'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '4/63'
  method: exact

operators:
- name: '\Phi_{(\omega_1;\omega_1)},\ \Phi_{(\omega_2;\omega_2)}'
  Delta: '4/63'
  spin: 0
  weights: '(\tfrac{2}{63}, \tfrac{2}{63})'
  degeneracy: 2
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: member_of
  target: w3-minimal-models
  at: 6

