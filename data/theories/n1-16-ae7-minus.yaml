id: n1-16-ae7-minus
name: '$\mathcal{N}_{16}^{(A,E_7)-}$'
aliases: ['$\mathcal{N}_{16}^{(D,E_7)-}$']
d: 2
summary: 'Bosonized $\mathcal{N}=1$ minimal model at $m=16$ with the exceptional $(A, E_7)$ invariant, GSO choice $-$.'
tags: [CFT, interacting, unitary, rational, coset, minimal model]

description: 'The $(A, E_7)$ and $(D, E_7)$ invariants have identical invariant matrices on the coset fields. The gap comes from the NS field $(5,5)$.'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '35/24'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '1/12'
  method: exact

operators:
- name: '\Phi_{5,5}'
  Delta: '1/12'
  spin: 0
  weights: '(\tfrac{1}{24}, \tfrac{1}{24})'
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: related_to
  target: n1-16-ae7-plus
  note: Opposite GSO choice.
- type: related_to
  target: n1-minimal-aa-even
  at: 16
  note: 'Exceptional invariant at $m=16$.'

references:
