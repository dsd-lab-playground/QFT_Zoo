id: klebanov-witten-4d
name: 'Klebanov–Witten theory'
aliases:
  - 'Conifold theory'
  - '$T^{1,1}$ theory'
  - '$\mathcal{N}=1$ $SU(N)\times SU(N)$ theory of D3-branes at the conifold'
d: 4
summary: >-
  The $\mathcal{N}=1$ SCFT on $N$ D3-branes at the conifold singularity: $SU(N)\times SU(N)$ gauge theory
  with bifundamentals $A_{1,2}$, $B_{1,2}$ and a quartic superpotential. It is dual to type IIB string
  theory on $AdS_5\times T^{1,1}$.
tags: [CFT, SCFT, interacting, unitary, gauge theory, supersymmetric, Lagrangian, holographic, large N, family]

description: |
  Gauge group $SU(N)\times SU(N)$ with chiral multiplets $A_1, A_2$ in the $(\mathbf{N}, \overline{\mathbf{N}})$
  and $B_1, B_2$ in the $(\overline{\mathbf{N}}, \mathbf{N})$, and superpotential
  $$W = \tfrac{\lambda}{2}\,\epsilon^{ij}\epsilon^{kl}\,\mathrm{Tr}\,A_iB_kA_jB_l .$$
  On D3-branes the gauge group is $U(N)\times U(N)$, but the $U(1)$ factors are infrared free and
  decouple. From the point of view of either $SU(N)$ factor the matter is $2N$ flavours, i.e.
  $N_f = 2N_c$, far from both edges of the SQCD conformal window. The unique anomaly-free $R$-symmetry gives
  $R_A = R_B = \tfrac12$, so $W$ has $R = 2$ and is marginal at the fixed point.

  Conformal invariance imposes one condition on the gauge couplings $g_1, g_2$ and $\lambda$, so the
  fixed points form a surface generated by two exactly marginal operators: $W$ and the difference of
  the two gauge kinetic terms. Klebanov and Witten [@kw1998] propose to identify these two complex moduli with the
  type IIB coupling $\tau$ and with the periods of the NS-NS and R-R two-forms on the 2-cycle of
  $T^{1,1} = (SU(2)\times SU(2))/U(1) \simeq S^2\times S^3$.

  The chiral primaries $\mathrm{Tr}\,A_{k_1}B_{l_1}\cdots A_{k_n}B_{l_n}$ are symmetric in the $SU(2)$
  indices (by the F-term equations) and have $R = n$, $\Delta = \tfrac{3n}{2}$; they match the scalar
  harmonics on $T^{1,1}$, and $\mathrm{Tr}\,A_kB_l$ are the conifold coordinates $z_i$. The baryon-like
  operators $\det A$ and $\det B$ have $\Delta = \tfrac{3N}{4}$, which supergravity reproduces from
  D3-branes wrapped on 3-cycles of $T^{1,1}$ [@gk1998].

  **Flows.** The theory is the infrared limit of the $\mathcal{N}=2$ $\mathbb{Z}_2$ orbifold of
  $\mathcal{N}=4$ SYM ($SU(N)\times SU(N)$ with bifundamental hypermultiplets) deformed by the mass
  term $\tfrac{m}{2}(\mathrm{Tr}\,\Phi^2 - \mathrm{Tr}\,\tilde\Phi^2)$ for the two adjoint chiral
  multiplets; integrating them out produces $W$. Geometrically this is the blow-up of $S^5/\mathbb{Z}_2$
  to $T^{1,1}$. At large $N$ the central charges drop by the factor $27/32$ along this flow, which
  Gubser [@gubser1998] derived both from 't Hooft anomalies and from the ratio of volumes.

parameters:
  - symbol: 'N'
    description: Rank of each $SU(N)$ factor (number of D3-branes).
    range: '$N \geq 2$'
  - symbol: 'u_1,\ u_2'
    description: Exactly marginal couplings $u_i = \lambda\Lambda_i$, dual to $\tau$ ($u_1+u_2$) and the two-form periods ($u_1-u_2$).
    range: 'a two-complex-dimensional conformal manifold'

family:
  parameter: N
  members:
    - at: 2
      label: '$SU(2)\times SU(2) \simeq SO(4)$ with four vectors'
      note: '$W$ reduces to the baryon operator of Intriligator and Seiberg [@is1995], found there to be exactly marginal.'
    - at: '\infty'
      label: 'Large $N$'
      note: 'Type IIB supergravity on $AdS_5\times T^{1,1}$ with $N$ units of five-form flux; $a = c = 27N^2/64$.'

symmetry:
  spacetime: '$SU(2,2|1)$ — 4d $\mathcal{N}=1$ superconformal group (4 $Q$ + 4 $S$ supercharges); parity not recorded'
  supercharges: 4
  global: '$SU(2)\times SU(2)$ rotating $A_k$ and $B_l$ (on the mesonic operators $\mathrm{Tr}\,A_kB_l$ this is the $SO(4)$ isometry of the conifold), the non-anomalous baryonic $U(1)_B$ with $A_k \to e^{i\alpha}A_k$, $B_l \to e^{-i\alpha}B_l$, and $U(1)_R$'
  gauge: '$SU(N)\times SU(N)$'
  notes: 'Discrete symmetries include the exchange $A\leftrightarrow B$ combined with the exchange of the gauge factors and an $R$-transformation, matching the reflection $z_4 \to -z_4$ of the conifold.'

quantities:
  - symbol: 'a'
    description: 'Euler conformal anomaly (a free chiral multiplet has $a = \tfrac{1}{48}$)'
    value: '\frac{27N^2}{64} - \frac{3}{8}'
    method: anomaly
    refs: [kw1998, iw2003]
    note: 'From $a = \tfrac{3}{32}(3\mathrm{Tr}R^3 - \mathrm{Tr}R)$ with $2(N^2-1)$ gauginos ($R=1$) and $4N^2$ chiral fermions ($R=-\tfrac12$): $\mathrm{Tr}R = -2$, $\mathrm{Tr}R^3 = \tfrac32 N^2 - 2$.'
  - symbol: 'c'
    description: 'Weyl conformal anomaly (a free chiral multiplet has $c = \tfrac{1}{24}$)'
    value: '\frac{27N^2}{64} - \frac{1}{4}'
    method: anomaly
    refs: [kw1998, iw2003]
    note: 'From $c = \tfrac{1}{32}(9\mathrm{Tr}R^3 - 5\mathrm{Tr}R)$ with the same traces, so $c - a = \tfrac18$.'
  - symbol: 'a = c'
    description: 'Leading large-$N$ value'
    value: '\frac{27N^2}{64}'
    method: AdS/CFT, supergravity, with anomaly matching
    refs: [gubser1998]
    note: 'Gubser [@gubser1998] finds $c/c_0 = 27/16$ relative to $\mathcal{N}=4$ $U(N)$ SYM with $c_0 = N^2/4$, equal to $\mathrm{Vol}(S^5)/\mathrm{Vol}(T^{1,1})$, and $a_{\rm IR}/a_{\rm UV} = c_{\rm IR}/c_{\rm UV} = 27/32$ relative to the $\mathbb{Z}_2$ orbifold theory ($a = c = N^2/2$). The ratio $27/32$ is to the orbifold, not to $\mathcal{N}=4$ SYM.'

operators:
  - name: '\mathrm{Tr}\,A_kB_l'
    Delta: '\frac{3}{2}'
    spin: 0
    rep: '$(\mathbf{2}, \mathbf{2})$ of $SU(2)\times SU(2)$, $R = 1$'
    method: exact
    refs: [kw1998]
    note: 'Lowest chiral primary; the conifold coordinates.'
  - name: '\mathrm{Tr}\,A_{(k_1}B_{(l_1}\cdots A_{k_n)}B_{l_n)}'
    Delta: '\frac{3n}{2}'
    spin: 0
    rep: '$(\mathbf{n+1}, \mathbf{n+1})$, $R = n$'
    method: exact
    refs: [kw1998]
    note: 'Chiral primaries, dual to scalar harmonics on $T^{1,1}$.'
  - name: '\det A,\ \det B'
    Delta: '\frac{3N}{4}'
    spin: 0
    rep: '$(\mathbf{N+1}, \mathbf{1})$ and $(\mathbf{1}, \mathbf{N+1})$ of $SU(2)\times SU(2)$, with $U(1)_B$ charges $+N$ and $-N$'
    method: exact
    refs: [gk1998]
    note: 'Baryon-like chiral operators, with all $SU(N)$ indices antisymmetrized; dual to wrapped D3-branes.'
  - name: 'J_\mu^{SU(2)\times SU(2)},\ J_\mu^{R}'
    Delta: 3
    spin: 1
    rep: 'adjoint; singlet'
    method: exact
    note: Conserved currents.
  - name: 'T_{\mu\nu}'
    Delta: 4
    spin: 2
    rep: singlet
    method: exact
    note: Stress tensor (conserved).

relations:
  - type: flows_to
    target: n4-sym
    note: 'On the branch where all $A_k$, $B_l$ are proportional to the identity (the D3-branes at a smooth point of the conifold), $SU(N)\times SU(N)$ breaks to its diagonal $SU(N)$. Of the $4N^2$ chiral components, $N^2-1$ are eaten, leaving three adjoints and four gauge-singlet chiral multiplets: the low-energy theory is $\mathcal{N}=4$ $SU(N)$ SYM together with a decoupled free singlet sector.'
  - type: related_to
    target: sqcd-conformal-window-4d
    note: 'Each $SU(N)$ node alone is SQCD with $N_f = 2N_c$, inside the conformal window.'

