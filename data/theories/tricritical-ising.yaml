id: tricritical-ising
name: Tricritical Ising CFT
short_name: '2d tricritical Ising'
aliases: ['$\mathcal{M}(5,4)$', TIM, '$\mathcal{N}=1$ minimal model $m=3$']
d: 2
summary: 'The $c = \tfrac{7}{10}$ unitary minimal model, describing tricritical points with $\mathbb{Z}_2$ symmetry; the simplest $\mathcal{N}=1$ superconformal minimal model.'
tags: [CFT, interacting, unitary, rational, exactly solvable, minimal model, critical phenomena]

description: 'The $m=4$ diagonal minimal model. It describes the tricritical point of the Blume–Capel model and is the IR fixed point of the $\phi^6$ Landau–Ginzburg theory. Its NS-sector fields organise into representations of the $\mathcal{N}=1$ super-Virasoro algebra (Friedan–Qiu–Shenker); its modular data factorise as Fibonacci $\boxtimes$ a braided Ising category.'

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\phi)^2 + \lambda\,\phi^6 \quad (\text{Landau–Ginzburg description, tuned to the tricritical point})'

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac{7}{10}$ — 2d conformal symmetry, with parity'
  supercharges: 0
  global: '$\mathbb{Z}_2$'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '7/10'
  method: exact
  refs: [fqs1984]
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '3/40'
  method: exact
  refs: [fqs1984]

