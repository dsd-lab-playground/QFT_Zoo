id: tim-sym2
name: '$\mathrm{Sym}^2(\mathrm{TIM})$'
aliases: ['$\mathrm{TIM}^2/D_4$', '$\mathrm{PF}_8/C$']
d: 2
summary: 'Symmetric product of two tricritical Ising models: the orbifold of TIM$^2$ by the exchange $s$.'
tags: [CFT, interacting, unitary, rational, orbifold]

description: 'The symmetry of TIM$^2$ is the dihedral group $D_4$ of order 8 generated by the spin flips $f_1, f_2$ and the exchange $s$. $\mathrm{TIM}^2/D_4$ gives term-by-term the same partition function, and so does the charge-conjugation orbifold $\mathrm{PF}_8/C$.'

symmetry:
  spacetime: 'Two Virasoro algebras, $c = \bar c = \tfrac75$ — 2d conformal symmetry, with parity'
  global: 'Contains the dual $\mathbb{Z}_2$ of the orbifold, odd on the $s$-twisted sector, and the diagonal spin flip $f_1 f_2$, which commutes with $s$'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '7/5'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '3/40'
  method: exact

operators:
- name: '\mathcal{O}'
  Delta: '3/40'
  spin: 0
  weights: '(\tfrac{3}{80}, \tfrac{3}{80})'
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: orbifold_of
  target: tim-squared
  note: 'By the exchange $s$.'
- type: related_to
  target: pf8
  note: '$\mathrm{PF}_8/C$ has the same torus partition function.'

references:
- key: dvvv1989
  title: The operator algebra of orbifold models
  authors: Dijkgraaf, Vafa, Verlinde, Verlinde
  year: 1989
  journal: Commun. Math. Phys. 123, 485
  doi: '10.1007/BF01238812'
  note: construction ingredients
- key: gepnerqiu1987
  title: Modular invariant partition functions for parafermionic field theories
  authors: Gepner, Qiu
  year: 1987
  journal: Nucl. Phys. B285, 423
  doi: '10.1016/0550-3213(87)90348-8'
  note: construction ingredients

contributors: [nathansbenjamin]
