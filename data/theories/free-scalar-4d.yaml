id: free-scalar-4d
name: Free massless scalar (4d)
aliases:
  - 4d Gaussian fixed point
d: 4
summary: >-
  A single free massless real scalar in four dimensions: the Gaussian fixed
  point, and the reference point for the 4d conformal anomalies $a$ and $c$.
tags: [CFT, free, unitary, Lagrangian, exactly solvable]

description: |
  The simplest CFT in $d=4$. All correlators follow from Wick
  contractions of $\langle \phi(x)\phi(0)\rangle \propto |x|^{-2}$.

  Unlike in $d=3$, the $\phi^4$ coupling is marginal at the free point, and it
  is marginally irrelevant: it runs to zero in the IR, so there is no flow to an
  interacting fixed point. The Wilson–Fisher fixed point merges with this one
  as $d \to 4$.

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\phi)^2'

symmetry:
  spacetime: conformal
  supercharges: 0
  global: '$\mathbb{Z}_2$ ($\phi\to-\phi$), plus shift symmetry $\phi \to \phi + \text{const}$'

quantities:
  - key: a
    symbol: 'a'
    description: 'Euler conformal anomaly'
    value: '1/360'
    method: exact
    refs: [duff1994]
    note: 'Normalised by $\langle T^\mu{}_\mu\rangle = \frac{c}{16\pi^2}W^2 - \frac{a}{16\pi^2}E_4$, the same normalisation as $\mathcal{N}=4$ SYM. Duff''s eq. (31) with $N_S = 1$, where $b^\prime = -a/(4\pi)^2$.'
  - symbol: 'c'
    description: 'Weyl conformal anomaly'
    value: '1/120'
    method: exact
    refs: [duff1994]
    note: 'Same normalisation as $a$. Duff''s eq. (30) with $N_S = 1$, where $b = c/(4\pi)^2$.'
  - key: C_T
    symbol: 'C_T'
    description: 'Stress-tensor two-point coefficient'
    value: '\frac{1}{3\pi^4}'
    method: exact
    refs: [osborn1994]
    note: 'Osborn–Petkou eq. (5.5), $C_T = \frac{d}{d-1}\frac{1}{S_d^2}$, at $d=4$ with $S_4 = 2\pi^2$.'
  - key: c_tilde
    symbol: '\tilde c'
    description: 'Thermal free energy density on $S^1_\beta\times\mathbb{R}^{3}$, $f = -\tilde c\,\frac{\pi^2}{90}\,T^{4}$ ($\tilde c = 1$ for one free real scalar)'
    value: '1'
    method: exact
    refs: [sachdev1993, iliesiu2018, laine2016]
    note: 'Normalization of Sachdev eq. (1): $f = -\tilde c\,\Gamma(d/2)\zeta(d)\pi^{-d/2}T^d$. Iliesiu et al. (2018), Sec. 2.1.1: one free real scalar has $b_T = -2d\zeta(d)/S_d$ and $f = b_T/d$, i.e. $f = -\Gamma(d/2)\zeta(d)\pi^{-d/2}T^d$ $= -\pi^2T^4/90$. Laine and Vuorinen eq. (5.52): $f = -\pi^2T^4/90$ per real scalar.'

operators:
  - name: '\phi'
    Delta: 1
    spin: 0
    rep: '$\mathbb{Z}_2$-odd'
    method: exact
  - name: '\phi^2'
    Delta: 2
    spin: 0
    rep: '$\mathbb{Z}_2$-even'
    method: exact
  - name: '\phi^4'
    Delta: 4
    spin: 0
    rep: '$\mathbb{Z}_2$-even'
    method: exact
    note: Marginal at the free point; the coupling is marginally irrelevant.
  - name: 'T_{\mu\nu}'
    Delta: 4
    spin: 2
    rep: '$\mathbb{Z}_2$-even'
    method: exact
    note: Stress tensor (conserved).

relations:
  - type: related_to
    target: free-scalar-3d
    note: 'The free scalar in $d=3$ and $d=4$: $\phi^4$ is relevant in $d=3$ (flowing to the 3d Ising CFT) and marginally irrelevant in $d=4$.'
  - type: related_to
    target: n4-sym
    note: 'At $g_{\rm YM} \to 0$, $\mathcal{N}=4$ SYM becomes free fields (keeping only gauge-invariant operators), including $6\dim G$ real scalars.'

references:
  - key: duff1994
    title: Twenty years of the Weyl anomaly
    authors: Duff
    year: 1994
    journal: Class. Quant. Grav. 11, 1387
    arxiv: hep-th/9308075
    doi: 10.1088/0264-9381/11/6/004
  - key: osborn1994
    title: Implications of conformal invariance in field theories for general dimensions
    authors: Osborn, Petkou
    year: 1994
    journal: Annals Phys. 231, 311
    arxiv: hep-th/9307010
    doi: 10.1006/aphy.1994.1045
  - key: sachdev1993
    title: Polylogarithm identities in a conformal field theory in three dimensions
    authors: Sachdev
    year: 1993
    journal: Phys. Lett. B 309, 285
    arxiv: hep-th/9305131
    note: 'Defines the thermal coefficient $\tilde c$ (eq. 1) and proves $\tilde c/N = 4/5$ for the $O(N)$ model at $N=\infty$.'
  - key: iliesiu2018
    title: The Conformal Bootstrap at Finite Temperature
    authors: Iliesiu, Koloğlu, Mahajan, Perlmutter, Simmons-Duffin
    year: 2018
    journal: JHEP 10 (2018) 070
    arxiv: '1802.10266'
  - key: laine2016
    title: Basics of Thermal Field Theory
    authors: Laine, Vuorinen
    year: 2016
    journal: Lect. Notes Phys. 925
    arxiv: '1701.01554'

contributors: [rodriguez-va, davidsd]
