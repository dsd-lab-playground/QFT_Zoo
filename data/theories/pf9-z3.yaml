id: pf9-z3
name: '$\mathrm{PF}_9/\mathbb{Z}_3$'
d: 2
summary: 'Orbifold of the $\mathbb{Z}_9$ parafermions by the rotation subgroup $\mathbb{Z}_3 \subset \mathbb{Z}_9$.'
tags: [CFT, interacting, unitary, rational, orbifold]

description: '$\mathrm{PF}_k/\mathbb{Z}_d$ and $\mathrm{PF}_k/\mathbb{Z}_{k/d}$ have the same partition function. For $k=9$, $d=3$ this is the extension of $\mathrm{PF}_9$ by its weight-2, order-three parafermion currents.'

symmetry:
  spacetime: '$O(3,1)$, extended to two Virasoro algebras, $c = \bar c = \tfrac{16}{11}$ — 2d conformal group with parity'
  global: 'Contains the dual $\mathbb{Z}_3$ of the orbifold and the action of $D_9/\mathbb{Z}_3 \cong S_3$ (images of $r$ and $C$)'

quantities:
- key: c
  symbol: c
  description: 'Central charge ($c_L = c_R$)'
  value: '16/11'
  method: exact
- key: gap
  symbol: '\Delta_{\rm gap}'
  description: 'Spectral gap: scaling dimension of the lightest non-vacuum Virasoro primary'
  value: '2/11'
  method: exact

operators:
- name: '\mathcal{O}'
  Delta: '2/11'
  spin: 0
  weights: '(\tfrac{1}{11}, \tfrac{1}{11})'
  degeneracy: 4
  note: Lightest non-vacuum Virasoro primary.

relations:
- type: orbifold_of
  target: pf9
  note: 'By $\mathbb{Z}_3 \subset \mathbb{Z}_9$.'

references:
