    title: S-Duality of Boundary Conditions In N=4 Super Yang-Mills Theory
    authors: Gaiotto, Witten
    year: 2009
    journal: Adv. Theor. Math. Phys. 13, 721
    arxiv: '0807.3720'
  - key: benvenuti2011
    title: '3D-partition functions on the sphere: exact evaluation and mirror symmetry'
    authors: Benvenuti, Pasquetti
    year: 2012
    journal: JHEP 05 (2012) 099
    arxiv: '1105.2551'
  - key: nishioka2011
    title: 3d Partition Function as Overlap of Wavefunctions
    authors: Nishioka, Tachikawa, Yamazaki
    year: 2011
    journal: JHEP 08 (2011) 003
    arxiv: '1105.4390'
  - key: assel2012
    title: Large N Free Energy of 3d N=4 SCFTs and AdS4/CFT3
    authors: Assel, Estes, Yamazaki
    year: 2012
    journal: JHEP 09 (2012) 074
    arxiv: '1206.2920'
  - key: chang2019
    title: 3d N=4 Bootstrap and Mirror Symmetry
    authors: Chang, Fluder, Lin, Shao, Wang
    year: 2021
    journal: SciPost Phys. 10, 097
    arxiv: '1910.03600'

