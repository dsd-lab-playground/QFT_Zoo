id: free-scalar-5d
name: Free massless scalar (5d)
aliases:
  - 5d Gaussian fixed point
  - Free conformal scalar (5d)
d: 5
summary: >-
  A single free massless real scalar in five dimensions: the Gaussian fixed
  point, and the reference value for the 5d sphere free energy and $C_T$.
tags: [CFT, free, unitary, Lagrangian, exactly solvable]

description: |
  The simplest CFT in $d=5$. All correlators follow from Wick contractions of
  $\langle \phi(x)\phi(0)\rangle \propto |x|^{-3}$, so $\Delta_\phi = \tfrac32$ and
  the normal-ordered power $\phi^n$ has $\Delta = \tfrac{3n}{2}$. On a curved
  background the scalar is conformally coupled, which fixes its partition
  function on the round $S^5$.

  In $d=5$ the cubic operator $\phi^3$ is relevant and the quartic operator
  $\phi^4$ is irrelevant. For $4<d<6$ the large-$N$ analysis of the $O(N)$ model
  with a $(\phi^i\phi^i)^2$ interaction indicates a unitary UV fixed point, and
  Fei, Giombi and Klebanov [@fei2014] proposed that the same CFT is the IR fixed point of a
  cubic theory of $N+1$ scalars (see the 5d $O(N)$ model entry for its status).
  The $\tilde F$-theorem then requires
  $N\tilde F_s < \tilde F_{\rm crit} < (N+1)\tilde F_s$, with $\tilde F_s$ the value
  below. Fei, Giombi and Klebanov [@fei2014] checked this inequality in $d=5$.

  ### Sphere free energy
  Giombi and Klebanov [@giombi2014, Eq. (1.5)] define $\tilde F = \sin(\pi d/2)\log Z_{S^d} = -\sin(\pi d/2)\,F$,
  where $F = -\log Z_{S^d}$. In $d=5$, $\sin(5\pi/2) = 1$, so $\tilde F = \log Z_{S^5} = -F$.
  For the free conformal scalar $F$ is negative in $d=5$
  [@klebanov2011, Table 1], and $\tilde F$ is positive. For free fields $\tilde F$ is a smooth,
  positive function of continuous $d$ that equals $(-1)^{(d+1)/2}F$ in odd $d$ and
  tends to $(-1)^{d/2}\frac{\pi}{2}a$ in even $d$. Giombi and Klebanov [@giombi2014] conjecture
  that $\tilde F$ decreases under RG flow in every $d$ (the $\tilde F$-theorem).

lagrangian: '\mathcal{L} = \tfrac{1}{2}(\partial\phi)^2'

symmetry:
  spacetime: '5d conformal group with parity'
  euclidean: '$O(6,1)$'
  lorentzian: '$O(5,2)$'
  supercharges: 0
  global: '$\mathbb{Z}_2$ ($\phi\to-\phi$), plus shift symmetry $\phi \to \phi + \text{const}$'

quantities:
  - symbol: '\tilde F'
    description: 'Sphere free energy in the convention of Giombi and Klebanov [@giombi2014], $\tilde F = \sin(\pi d/2)\log Z_{S^d}$; at $d=5$, $\tilde F = \log Z_{S^5} = -F$'
    value: '\frac{1}{2^8}\left(2\log 2 + \frac{2\zeta(3)}{\pi^2} - \frac{15\zeta(5)}{\pi^4}\right) \approx 5.74\times 10^{-3}'
    method: exact
    refs: [klebanov2011, giombi2014]
    note: 'Klebanov, Pufu and Safdi [@klebanov2011, Table 1] give $F = -\log|Z_{S^5}| = \frac{-1}{2^8}\left(2\log 2 + \frac{2\zeta(3)}{\pi^2} - \frac{15\zeta(5)}{\pi^4}\right) \approx -5.74\times10^{-3}$. The sign is flipped with [@giombi2014, Eq. (1.5)]. A numerical evaluation of the integral in [@giombi2014, Eq. (2.5)] at $d=5$ gives the same number.'
  - symbol: 'C_T'
    description: 'Stress-tensor two-point coefficient in the absolute Osborn–Petkou normalization, $\langle T_{\mu\nu}(x)T_{\sigma\rho}(0)\rangle = C_T\,\mathcal{I}_{\mu\nu,\sigma\rho}(x)/x^{2d}$'
    value: '\frac{45}{256\pi^4}'
    method: exact
    refs: [osborn1994]
    note: '[@osborn1994, Eq. (5.5)], $C_T = \frac{d}{d-1}\frac{1}{S_d^2}$ with $S_d = 2\pi^{d/2}/\Gamma(d/2)$, evaluated at $d=5$, where $S_5 = 8\pi^2/3$.'

operators:
  - name: '\phi'
    Delta: '\frac{3}{2}'
    spin: 0
    rep: '$\mathbb{Z}_2$-odd'
    method: exact
    refs: [osborn1994]
    note: 'From the propagator $\langle\phi(x)\phi(0)\rangle = \frac{1}{(d-2)S_d\,x^{d-2}}$ [@osborn1994, Eq. (5.3)].'
  - name: '\phi^2'
    Delta: 3
    spin: 0
    rep: '$\mathbb{Z}_2$-even'
    method: exact
    refs: [osborn1994]
  - name: '\phi^3'
    Delta: '\frac{9}{2}'
    spin: 0
    rep: '$\mathbb{Z}_2$-odd'
    method: exact
    refs: [osborn1994]
    note: 'Relevant.'
  - name: '\phi^4'
    Delta: 6
    spin: 0
    rep: '$\mathbb{Z}_2$-even'
    method: exact
    refs: [osborn1994]
    note: 'Irrelevant.'
  - name: 'T_{\mu\nu}'
    Delta: 5
    spin: 2
    rep: '$\mathbb{Z}_2$-even'
    method: exact
    note: Stress tensor (conserved).

references:
  - key: osborn1994
    title: Implications of conformal invariance in field theories for general dimensions
    authors: Osborn, Petkou
    year: 1994
    journal: Annals Phys. 231, 311
    arxiv: hep-th/9307010
    doi: 10.1006/aphy.1994.1045
  - key: klebanov2011
    title: F-Theorem without Supersymmetry
    authors: Klebanov, Pufu, Safdi
    year: 2011
    journal: JHEP 10 (2011) 038
    arxiv: '1105.4598'
    doi: 10.1007/JHEP10(2011)038
    note: 'Table 1: $F$ of a free conformal scalar on $S^d$ for odd $d$.'
  - key: giombi2014
    title: Interpolating between $a$ and $F$
    authors: Giombi, Klebanov
    year: 2015
    journal: JHEP 03 (2015) 117
    arxiv: '1409.1937'
    doi: 10.1007/JHEP03(2015)117
    note: 'Definition of $\tilde F$ (eq. (1.5)) and its integral representation for free fields (eqs. (2.5), (2.6)).'
  - key: fei2014
    title: Critical $O(N)$ models in $6-\epsilon$ dimensions
    authors: Fei, Giombi, Klebanov
    year: 2014
    journal: Phys. Rev. D 90, 025018
    arxiv: '1404.1094'
    doi: 10.1103/PhysRevD.90.025018

