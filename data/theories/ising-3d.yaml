    authors: Caselle, Costagliola, Magnoli
    year: 2016
    arxiv: '1605.05133'
    doi: '10.1103/PhysRevD.94.026005'
    journal: 'Phys. Rev. D 94, 026005'
    note: 'Eqs. (1), (4), p. 2, and the Monte Carlo section, p. 3, fix the thermal-coupling sign convention.'
  - key: bhardwaj2024phases
    title: 'Gapped Phases in (2+1)d with Non-Invertible Symmetries: Part I'
    authors: Bhardwaj, Pajer, Schafer-Nameki, Tiwari, Warman, Wu
    year: 2025
    arxiv: '2408.05266'
    doi: '10.21468/SciPostPhys.19.2.056'
    journal: 'SciPost Physics 19, 056'
    note: 'Section 4.1.1, Eqs. (4.5)-(4.13), arXiv v2 pp. 27-29, distinguishes SSB, trivial and SPT phases.'

