    title: Bootstrapping the 3d Ising Stress Tensor
    authors: Chang, Dommes, Erramilli, Homrich, Kravchuk, Liu, Mitchell, Poland, Simmons-Duffin
    year: 2024
    arxiv: '2411.15300'
  - key: kos2016
