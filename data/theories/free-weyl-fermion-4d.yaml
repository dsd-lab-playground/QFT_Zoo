id: free-weyl-fermion-4d
name: Free massless Weyl fermion (4d)
aliases:
  - Free Majorana fermion (4d)
  - 4d free chiral fermion
d: 4
summary: >-
  A single free massless Weyl fermion in four dimensions (equivalently, a
  Majorana fermion): the basic chiral matter field, whose $U(1)$ symmetry has
  't Hooft anomalies.
tags: [CFT, free, unitary, Lagrangian, exactly solvable]

description: |
  A left-handed two-component spinor $\psi_\alpha$ with
  $\langle \psi_\alpha(x)\bar\psi_{\dot\alpha}(0)\rangle \propto x_\mu\sigma^\mu_{\alpha\dot\alpha}/|x|^4$.
  All correlators follow from Wick contractions. In $d=4$ a Weyl fermion and a
  Majorana fermion are the same theory. A Dirac fermion is two Weyl fermions, so
  its $a$, $c$ and $C_T$ are twice the values below.

  The phase rotation $\psi \to e^{i\alpha}\psi$ is a $U(1)$ symmetry with 't Hooft
  anomalies: the $U(1)^3$ and mixed $U(1)$–gravitational triangle anomalies are
  proportional to $\sum q^3 = 1$ and $\sum q = 1$. So this $U(1)$ cannot be gauged on
  its own. The only Lorentz-invariant mass term is the Majorana mass
  $m\,\psi\psi + \text{h.c.}$, which breaks $U(1)$ to fermion parity $(-1)^F$.
  Every $U(1)$-invariant deformation is irrelevant: the lightest is the four-fermion
  operator, with $\Delta = 6$.

lagrangian: '\mathcal{L} = i\,\bar\psi_{\dot\alpha}\,\bar\sigma^{\mu\,\dot\alpha\alpha}\partial_\mu\psi_\alpha'

symmetry:
  spacetime: '4d conformal group with parity combined with charge conjugation ($CP$; $P$ alone maps the left-handed fermion to a right-handed one)'
  euclidean: '$O(5,1)$'
  lorentzian: '$O(4,2)$'
  supercharges: 0
  global: '$U(1)$ ($\psi\to e^{i\alpha}\psi$), with $U(1)^3$ and $U(1)$–gravitational ''t Hooft anomalies; it contains fermion parity $(-1)^F$'
  parity: true
  global_group:
    - {id: U(1), group: U(1), note: 'Parity ($CP$) maps charge $q$ to $-q$.'}

quantities:
  - key: a
    symbol: 'a'
    description: 'Euler conformal anomaly'
    value: '11/720'
    method: exact
    refs: [duff1994]
    note: 'Same normalisation as the 4d free scalar ($a = 1/360$) and $\mathcal{N}=4$ SYM. Duff''s eq. (31), where $N_F$ counts Dirac fermions, at $N_F = \tfrac12$.'
  - symbol: 'c'
    description: 'Weyl conformal anomaly'
    value: '1/40'
    method: exact
    refs: [duff1994]
    note: 'Duff''s eq. (30) at $N_F = \tfrac12$.'
  - key: C_T
    symbol: 'C_T'
    description: 'Stress-tensor two-point coefficient'
    value: '\frac{1}{\pi^4}'
    method: exact
    refs: [osborn1994]
    note: 'Half the Dirac value of Osborn–Petkou eq. (5.6), $C_T = \tfrac{d}{2}\,2^{d/2}/S_d^2$, at $d=4$ with $S_4 = 2\pi^2$. It agrees with $C_T = 40c/\pi^4$, their eq. (8.12) in this normalisation.'

operators:
  - name: '\psi_\alpha'
    Delta: '\frac{3}{2}'
    spin: '(\tfrac12, 0)'
    lorentz: '(1/2, 0)'
    parity: pair
    global: {U(1): 1}
    method: exact
    note: 'Saturates the unitarity bound $\Delta \ge j+1$ for $(j, 0)$, so it is free: $\bar\sigma^\mu\partial_\mu\psi = 0$.'
  - name: '\psi\psi = \epsilon^{\alpha\beta}\psi_\alpha\psi_\beta'
    Delta: 3
    spin: 0
    parity: pair
    global: {U(1): 2}
    method: exact
    note: 'Majorana mass operator (with its conjugate $\bar\psi\bar\psi$, of charge $-2$). Relevant; it breaks $U(1)$ to $(-1)^F$.'
  - name: 'J_\mu = \bar\psi\bar\sigma_\mu\psi'
    Delta: 3
    spin: 1
    parity: odd
    global: {U(1): 0}
    method: exact
    note: Conserved $U(1)$ current.
  - name: 'T_{\mu\nu}'
    Delta: 4
    spin: 2
    parity: even
    global: {U(1): 0}
    method: exact
    note: Stress tensor (conserved).
  - name: '(\psi\psi)(\bar\psi\bar\psi)'
    Delta: 6
    spin: 0
    parity: even
    global: {U(1): 0}
    method: exact
    note: 'Lightest $U(1)$-invariant scalar deformation; irrelevant.'

relations:
  - type: related_to
    target: n4-sym
    note: 'At $g_{\rm YM} \to 0$, $\mathcal{N}=4$ SYM becomes free fields (keeping only gauge-invariant operators), including $4\dim G$ Weyl fermions.'

references:
  - key: duff1994
    title: Twenty years of the Weyl anomaly
    authors: Duff
    year: 1994
    journal: Class. Quant. Grav. 11, 1387
    arxiv: hep-th/9308075
    doi: 10.1088/0264-9381/11/6/004
  - key: osborn1994
    title: Implications of conformal invariance in field theories for general dimensions
    authors: Osborn, Petkou
    year: 1994
    journal: Annals Phys. 231, 311
    arxiv: hep-th/9307010
    doi: 10.1006/aphy.1994.1045

contributors: [nathansbenjamin]
