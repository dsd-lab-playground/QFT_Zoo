id: tn-4d
name: '$T_N$ theories'
aliases:
  - 'Gaiotto $T_N$ theories'
  - '$\mathcal{N}=2$ trinion theories'
  - 'Class $\mathcal{S}$ theory of the sphere with three full punctures'
d: 4
summary: >-
  The $\mathcal{N}=2$ SCFTs of $N$ M5-branes on a sphere with three full punctures, with
  $SU(N)^3$ flavor symmetry and no marginal coupling. They are the building blocks of class
  $\mathcal{S}$ theories; $T_2$ is free and $T_3$ is the $E_6$ Minahan–Nemeschansky theory.
tags: [CFT, SCFT, interacting, unitary, supersymmetric, non-Lagrangian, holographic, large N, family]

description: |
  Gaiotto [@gaiotto2009] obtained $T_N$ from the very strongly coupled limits of a conformal linear quiver of
  $SU(k)$ gauge groups, in which groups of $N-1$ basic punctures of the Seiberg–Witten curve
  collide. It is the $A_{N-1}$ $(2,0)$ theory, i.e. $N$ M5-branes, on a sphere with three full
  punctures, and it has no coupling constant. Each of its three $SU(N)$ flavor symmetries, when
  gauged, supplies half of the matter needed for a conformal $SU(N)$ gauge theory, since
  $k_{SU(N)} = 2N$ is half of $4h^\vee$. Gauging $3g-3$ pairs of $SU(N)$ symmetries of $2g-2$
  copies of $T_N$ gives the theory of a genus-$g$ surface, and every degeneration limit of a
  surface with full punctures is a generalized quiver of $T_N$ blocks.

  $T_2$ is four free hypermultiplets in the $(\mathbf{2},\mathbf{2},\mathbf{2})$ of
  $SU(2)^3$, the "blocks of four hypermultiplets" of Gaiotto's generalized $SU(2)$ quivers [@gaiotto2009]. In
  $T_3$ the Higgs-branch generators of dimension two include, besides the three moment maps,
  operators in the $(\mathbf{3},\mathbf{3},\mathbf{3})$ and $(\bar{\mathbf{3}},\bar{\mathbf{3}},\bar{\mathbf{3}})$,
  which enhance $SU(3)^3$ to $E_6$: $T_3$ is the $E_6$ Minahan–Nemeschansky theory. For
  $N \geq 4$, $T_N$ is an interacting SCFT with no known Lagrangian.

  Gaiotto and Maldacena [@gaiotto2009b] computed $a$ and $c$ by starting from a weakly coupled quiver and
  subtracting the weakly coupled tail that decouples in the degeneration limit, and expressed
  them through effective numbers $n_v$, $n_h$ of vector and hypermultiplets. They also
  constructed the gravity duals, $AdS_5$ solutions of M-theory; at large $N$,
  $a \simeq c \simeq N^3/6$. The Coulomb branch has $k-2$ operators of dimension $k$ for
  $k = 3,\dots,N$ [@chacaltana2010]. The Higgs-branch chiral ring is generated by the
  moment maps $\mu_{1,2,3}$, with
  $\mathrm{Tr}\,\mu_1^k = \mathrm{Tr}\,\mu_2^k = \mathrm{Tr}\,\mu_3^k$, and by operators
  $Q^{(k)}$ [@beem2013]. The chiral algebra has
  $c_{2d} = -12c$ and $\widehat{\mathfrak{su}}(N)^3$ symmetry at level $-N$.

parameters:
  - symbol: 'N'
    description: Number of M5-branes; the flavor symmetry is $SU(N)^3$.
    range: '$N \geq 2$'

family:
  parameter: N
  members:
    - at: 2
      label: 'Four free hypermultiplets'
      note: 'Trifundamental of $SU(2)^3$; $a = \tfrac16$, $c = \tfrac13$; no Coulomb branch.'
    - at: 3
      label: '$E_6$ Minahan–Nemeschansky theory'
      note: '$SU(3)^3$ enhanced to $E_6$ with $k_{E_6} = 6$; $a = \tfrac{41}{24}$, $c = \tfrac{13}{6}$; one Coulomb-branch operator, of dimension 3.'
    - at: 4
      note: '$SU(4)^3$ at $k = 8$; $n_v = 19$, $n_h = 40$, $a = \tfrac{45}{8}$, $c = \tfrac{13}{2}$ [@chacaltana2010]. Coulomb-branch operators of dimension 3 (one) and 4 (two).'

symmetry:
  spacetime: '$\mathcal{N}=2$ superconformal, $SU(2,2|2)$'
  supercharges: 8
  global: '$SU(N)^3$ flavor symmetry (enhanced to $E_6$ for $N=3$); R-symmetry $SU(2)_R\times U(1)_r$'
  notes: 'Flavor central charges are normalized so that gauging $G$ is conformal when the matter has $k_G = 4h^\vee(G)$.'

quantities:
  - symbol: 'a'
    description: 'Euler conformal anomaly (normalized so a free real scalar has $a = \tfrac{1}{360}$)'
    value: '\frac{N^3}{6} - \frac{5N^2}{16} - \frac{N}{16} + \frac{5}{24}'
    method: exact (S-duality of class S quivers)
    refs: [gaiotto2009b, chacaltana2010]
    note: 'Chacaltana–Distler [@chacaltana2010] (section on the $T_N$ series); equals $(5n_v + n_h)/24$ with the $n_v$, $n_h$ below. $N = 2, 3, 4$: $\tfrac16$, $\tfrac{41}{24}$, $\tfrac{45}{8}$.'
  - symbol: 'c'
    description: 'Weyl conformal anomaly (normalized so a free real scalar has $c = \tfrac{1}{120}$)'
    value: '\frac{N^3}{6} - \frac{N^2}{4} - \frac{N}{12} + \frac{1}{6}'
    method: exact (S-duality of class S quivers)
    refs: [gaiotto2009b, chacaltana2010, beem2013]
    note: '[@beem2013, Eq. (6.1); @chacaltana2010]; equals $(2n_v + n_h)/12$. $N = 2, 3, 4$: $\tfrac13$, $\tfrac{13}{6}$, $\tfrac{13}{2}$.'
  - symbol: '(n_v,\ n_h)'
    description: 'Effective numbers of vector and hypermultiplets, defined by $a = (5n_v+n_h)/24$, $c = (2n_v+n_h)/12$'
    value: '\left(\frac{2N^3}{3} - \frac{3N^2}{2} - \frac{N}{6} + 1,\ \ \frac{2N^3}{3} - \frac{2N}{3}\right)'
    method: exact (S-duality of class S quivers)
    refs: [gaiotto2009b]
    note: '[@gaiotto2009b, Eq. (2.4)]. They are not numbers of fields; at $N=2$ they give $(0, 4)$, the four free hypermultiplets.'
  - symbol: 'k_{SU(N)}'
    description: 'Flavor central charge of each $SU(N)$ factor'
    value: '2N'
    method: exact
    refs: [beem2013, chacaltana2010]
  - symbol: 'd_k'
    description: 'Number of Coulomb-branch operators of dimension $k$, $k = 2,\dots,N$'
    value: 'k - 2'
    method: exact (Seiberg–Witten curve)
    refs: [chacaltana2010]
    note: 'Graded dimension $(d_2, d_3, \dots, d_N) = (0, 1, \dots, N-2)$, so the rank is $(N-1)(N-2)/2$ (derived). Consistent with $n_v = \sum_k (2k-1)d_k$ [@chacaltana2010, Eq. (9)].'
  - symbol: '\dim_{\mathbb{H}}\mathcal{M}_H'
    description: 'Quaternionic dimension of the Higgs branch'
    value: '\frac{3N^2 - N - 2}{2}'
    method: derived
    refs: [chacaltana2010, gaiotto2009b]
    note: 'From $\dim_{\mathbb{H}}\mathcal{M}_H = n_h - n_v = 24(c-a)$ [@chacaltana2010] with the $n_v$, $n_h$ above. $N = 2, 3$: 4 and 11.'

operators:
  - name: '\mu_i'
    Delta: 2
    spin: 0
    rep: 'adjoint of $SU(N)_i$, $i = 1,2,3$; $SU(2)_R$ triplet'
    method: exact
    refs: [beem2013]
    note: 'Moment maps, the superconformal primaries of the flavor-current multiplets.'
  - name: 'Q^{(k)}'
    Delta: 'k(N-k)'
    spin: 0
    rep: '$(\wedge^k, \wedge^k, \wedge^k)$ of $SU(N)^3$, $k = 1,\dots,N-1$'
    method: exact
    refs: [beem2013, gaiotto2009b]
    note: 'Higgs-branch chiral ring generators. $Q^{(1)}$ is the trifundamental of dimension $N-1$ proposed by Gaiotto and Maldacena [@gaiotto2009b]; for $N=2$ it is the free hypermultiplet, and for $N=3$ $Q^{(1)}$ and $Q^{(2)}$ are the extra $E_6$ moment maps.'
  - name: 'u_k'
    Delta: 'k'
    spin: 0
    rep: 'flavor and $SU(2)_R$ singlets'
    method: exact
    refs: [chacaltana2010, gaiotto2009]
    note: 'Coulomb-branch operators: $k-2$ of them for each $k = 3,\dots,N$.'
  - name: 'T_{\mu\nu}'
    Delta: 4
    spin: 2
    rep: singlet
    method: exact
    note: Stress tensor (conserved).

references:
  - key: gaiotto2009
    title: N=2 dualities
    authors: Gaiotto
    year: 2012
    journal: JHEP 08 (2012) 034
    arxiv: '0904.2715'
  - key: gaiotto2009b
    title: The gravity duals of N=2 superconformal field theories
    authors: Gaiotto, Maldacena
    year: 2012
    journal: JHEP 10 (2012) 189
    arxiv: '0904.4466'
  - key: chacaltana2010
    title: Tinkertoys for Gaiotto Duality
    authors: Chacaltana, Distler
    year: 2010
    journal: JHEP 11 (2010) 099
    arxiv: '1008.5203'
  - key: beem2013
    title: Infinite Chiral Symmetry in Four Dimensions
    authors: Beem, Lemos, Liendo, Peelaers, Rastelli, van Rees
    year: 2015
    journal: Commun. Math. Phys. 336 (2015) 1359
    arxiv: '1312.5344'

relations:
  - type: related_to
    target: minahan-nemeschansky-4d
    note: '$T_3$ is the $E_6$ Minahan–Nemeschansky theory: its $SU(3)^3$ flavor symmetry is enhanced to $E_6$ [@gaiotto2009; @gaiotto2009b].'

